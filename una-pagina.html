<script>
/* ==========================================================================
   LICENCIA CLARA · Lógica compartida
   --------------------------------------------------------------------------
   Aquí vive todo lo que las pantallas necesitan:
     Sesion  → entrar, saber quién está dentro, salir
     Datos   → leer ciudadanos y bloqueos de licencia, multas vehiculares por
               placa, guardar actualizaciones, reiniciar
     Ui      → dibujar chips de estado, formatear textos, escapar HTML

   Los cambios del panel usan localStorage: se guardan EN ESTE NAVEGADOR Y EN
   ESTE DISPOSITIVO. No es una base compartida entre computadoras.
   La sesión usa sessionStorage: dura solo mientras la pestaña esté abierta.
   ========================================================================== */

(function (global) {
  "use strict";

  /* La sesión se guarda en sessionStorage: dura mientras la pestaña siga
     abierta (se conserva al cambiar de pantalla y al recargar), y desaparece
     al cerrarla. Así una visita nueva SIEMPRE empieza en la portada pública.
     La llave es nueva a propósito: la sesión antigua vivía en localStorage
     con "licencia-clara:sesion" y volvía a aparecer en cada visita. */
  var LLAVE_SESION         = "licencia-clara:sesion-pestana";
  var LLAVE_SESION_ANTIGUA = "licencia-clara:sesion";          /* localStorage, v1.0 */
  var LLAVE_CAMBIOS = "licencia-clara:cambios";
  /* v1.0 guardaba aquí qué bloqueos quedaban visibles tras consultar una
     placa. Ya no se usa (una placa no da acceso a bloqueos de licencia);
     solo se borra al reiniciar la demo. */
  var LLAVE_PLACA   = "licencia-clara:consulta-placa";

  /* ================================================== Almacenamiento === */
  /* Envolvemos localStorage en try/catch: en algunos navegadores (modo
     privado, cookies bloqueadas) lanza error y no queremos romper la web. */

  var Guardado = {
    leer: function (llave) {
      try {
        var crudo = global.localStorage.getItem(llave);
        return crudo ? JSON.parse(crudo) : null;
      } catch (e) { return null; }
    },
    escribir: function (llave, valor) {
      try {
        global.localStorage.setItem(llave, JSON.stringify(valor));
        return true;
      } catch (e) { return false; }
    },
    borrar: function (llave) {
      try { global.localStorage.removeItem(llave); } catch (e) { /* nada */ }
    },
    disponible: function () {
      try {
        global.localStorage.setItem("__prueba__", "1");
        global.localStorage.removeItem("__prueba__");
        return true;
      } catch (e) { return false; }
    }
  };

  /* Almacén de la pestaña (sessionStorage). Si el navegador lo bloquea,
     usamos una variable en memoria: la sesión dura hasta cambiar de página
     en la versión de varios archivos, y toda la visita en una-pagina.html. */
  var memoriaPestana = {};
  var Pestana = {
    leer: function (llave) {
      try {
        var crudo = global.sessionStorage.getItem(llave);
        return crudo ? JSON.parse(crudo) : null;
      } catch (e) {
        return memoriaPestana[llave] || null;
      }
    },
    escribir: function (llave, valor) {
      try {
        global.sessionStorage.setItem(llave, JSON.stringify(valor));
      } catch (e) {
        memoriaPestana[llave] = valor;
      }
    },
    borrar: function (llave) {
      delete memoriaPestana[llave];
      try { global.sessionStorage.removeItem(llave); } catch (e) { /* nada */ }
    }
  };

  /* Migración única: la sesión antigua de localStorage NO se restaura.
     Se elimina solo esa llave; los cambios del panel y demás datos quedan. */
  Guardado.borrar(LLAVE_SESION_ANTIGUA);

  /* ========================================================= Estados === */

  var ESTADOS = {
    gestion_ciudadano: {
      clave: "gestion_ciudadano",
      etiqueta: "Debes realizar una gestión",
      etiquetaCorta: "Debes gestionar",
      icono: "▲",
      color: "accion",
      responsablePorDefecto: "Ciudadano"
    },
    en_juzgado: {
      clave: "en_juzgado",
      etiqueta: "En trámite en el juzgado",
      etiquetaCorta: "En el juzgado",
      icono: "⏳",
      color: "juzgado",
      responsablePorDefecto: "Juzgado municipal"
    },
    en_transito: {
      clave: "en_transito",
      etiqueta: "Pendiente en Tránsito",
      etiquetaCorta: "En Tránsito",
      icono: "◷",
      color: "transito",
      responsablePorDefecto: "Departamento de Tránsito"
    },
    levantado: {
      clave: "levantado",
      etiqueta: "Bloqueo levantado",
      etiquetaCorta: "Levantado",
      icono: "✓",
      color: "listo",
      responsablePorDefecto: "Nadie"
    }
  };

  /* Los subestados solo aplican a "Pendiente en Tránsito".
     Existen porque la etiqueta sola esconde si al ciudadano todavía le toca
     presentar la solicitud. */
  var SUBESTADOS = {
    orden_sin_presentar: {
      clave: "orden_sin_presentar",
      etiqueta: "Orden obtenida, falta presentar la solicitud",
      responsable: "Ciudadano",
      icono: "▲",
      color: "accion",
      guia: "GUIA-TRANSITO-PRESENTAR"
    },
    solicitud_presentada: {
      clave: "solicitud_presentada",
      etiqueta: "Solicitud presentada, en revisión",
      responsable: "Departamento de Tránsito",
      icono: "◷",
      color: "transito",
      guia: "GUIA-TRANSITO-ESPERA"
    },
    con_observacion: {
      clave: "con_observacion",
      etiqueta: "Con observación: falta corregir",
      responsable: "Ciudadano",
      icono: "⚠",
      color: "alerta",
      guia: "GUIA-TRANSITO-ESPERA"
    }
  };

  /* ========================================================== Sesión === */

  var Sesion = {
    /* Devuelve el ciudadano si las credenciales DEMO coinciden, o null.
       Es la ÚNICA forma de abrir una sesión: una acción explícita en la
       pantalla de identidad. Consultar una placa nunca abre sesión. */
    entrar: function (usuario, clave) {
      var u = String(usuario || "").trim().toLowerCase();
      var c = String(clave || "");
      var encontrado = null;

      global.DATOS.ciudadanos.forEach(function (ciu) {
        if (ciu.usuario_demo.toLowerCase() === u && ciu.clave_demo === c) {
          encontrado = ciu;
        }
      });

      if (encontrado) {
        Pestana.escribir(LLAVE_SESION, {
          ciudadano_id: encontrado.id,
          entrada: new Date().toISOString()
        });
      }
      return encontrado;
    },

    /* Ciudadano de la sesión simulada, o null. */
    actual: function () {
      var s = Pestana.leer(LLAVE_SESION);
      if (!s || !s.ciudadano_id) return null;
      return Datos.ciudadanoPorId(s.ciudadano_id);
    },

    salir: function () {
      Pestana.borrar(LLAVE_SESION);
      Guardado.borrar(LLAVE_SESION_ANTIGUA);
    },

    /* Envía a la pantalla de identidad si no hay sesión. */
    exigir: function () {
      var ciu = Sesion.actual();
      if (!ciu) {
        Ui.navegar("#identidad?motivo=sesion");
        return null;
      }
      return ciu;
    }
  };

  /* =========================================================== Datos === */

  var Datos = {

    /* --- Búsquedas simples ------------------------------------------- */

    ciudadanoPorId: function (id) {
      return buscar(global.DATOS.ciudadanos, id);
    },
    licenciaDe: function (ciudadanoId) {
      var r = null;
      global.DATOS.licencias.forEach(function (l) {
        if (l.ciudadano_id === ciudadanoId) r = l;
      });
      return r;
    },
    municipalidadPorId: function (id) {
      return buscar(global.DATOS.municipalidades, id);
    },
    juzgadoPorId: function (id) {
      return buscar(global.DATOS.juzgados, id);
    },
    guiaPorId: function (id) {
      return buscar(global.DATOS.guias, id);
    },
    fuentePorId: function (id) {
      return buscar(global.DATOS.fuentes, id);
    },

    /* --- Cambios guardados ------------------------------------------- */

    cambios: function () {
      var c = Guardado.leer(LLAVE_CAMBIOS);
      if (!c || typeof c !== "object") c = {};
      if (!c.bloqueos)  c.bloqueos = {};
      if (!c.historial) c.historial = [];
      return c;
    },

    /* Bloqueo con los cambios del panel institucional ya aplicados. */
    bloqueoPorId: function (id) {
      var base = buscar(global.DATOS.bloqueos, id);
      if (!base) return null;
      var cambio = Datos.cambios().bloqueos[id];
      var b = copiar(base);
      if (cambio) {
        for (var k in cambio) {
          if (Object.prototype.hasOwnProperty.call(cambio, k)) b[k] = cambio[k];
        }
      }
      return b;
    },

    /* Todos los bloqueos de un ciudadano, ya con los cambios aplicados. */
    bloqueosDe: function (ciudadanoId) {
      var lista = [];
      global.DATOS.bloqueos.forEach(function (b) {
        if (b.ciudadano_id === ciudadanoId) {
          lista.push(Datos.bloqueoPorId(b.id));
        }
      });
      return lista;
    },

    /* Historial de un bloqueo: eventos de la semilla + eventos guardados,
       ordenados del más reciente al más antiguo. */
    historialDe: function (bloqueoId) {
      var lista = [];
      global.DATOS.historial.forEach(function (h) {
        if (h.bloqueo_id === bloqueoId) lista.push(copiar(h));
      });
      Datos.cambios().historial.forEach(function (h) {
        if (h.bloqueo_id === bloqueoId) lista.push(copiar(h));
      });
      lista.sort(function (a, b) {
        return aFecha(b.fecha) - aFecha(a.fecha);
      });
      return lista;
    },

    /* --- Vista completa para "Mi licencia" ---------------------------- */
    /* Los contadores SIEMPRE se calculan aquí, contando registros.
       No existe ningún contador guardado que pueda quedar desactualizado. */

    resumenDe: function (ciudadanoId) {
      var ciudadano = Datos.ciudadanoPorId(ciudadanoId);
      var licencia  = Datos.licenciaDe(ciudadanoId);
      var bloqueos  = Datos.bloqueosDe(ciudadanoId);

      var activos    = bloqueos.filter(function (b) { return b.estado !== "levantado"; });
      var resueltos  = bloqueos.filter(function (b) { return b.estado === "levantado"; });
      var requierenAccion = activos.filter(function (b) {
        return Datos.responsableDe(b) === "Ciudadano";
      });

      /* Agrupación por municipalidad, solo con lo que realmente existe. */
      var grupos = [];
      var indice = {};
      bloqueos.forEach(function (b) {
        if (!indice[b.municipalidad_id]) {
          indice[b.municipalidad_id] = {
            municipalidad: Datos.municipalidadPorId(b.municipalidad_id),
            activos: [], resueltos: []
          };
          grupos.push(indice[b.municipalidad_id]);
        }
        if (b.estado === "levantado") indice[b.municipalidad_id].resueltos.push(b);
        else                          indice[b.municipalidad_id].activos.push(b);
      });

      /* Primero las municipalidades donde el ciudadano tiene que actuar,
         después las que están en espera, al final las que ya no tienen nada.
         No inventamos urgencia legal ni ordenamos por cantidad de multas. */
      grupos.forEach(function (g) {
        g.requierenAccion = g.activos.filter(function (b) {
          return Datos.responsableDe(b) === "Ciudadano";
        }).length;
      });
      grupos.sort(function (a, b) {
        if (a.requierenAccion !== b.requierenAccion) return b.requierenAccion - a.requierenAccion;
        if (a.activos.length !== b.activos.length)   return b.activos.length - a.activos.length;
        return a.municipalidad.nombre.localeCompare(b.municipalidad.nombre, "es");
      });

      return {
        ciudadano: ciudadano,
        licencia: licencia,
        bloqueos: bloqueos,
        activos: activos,
        resueltos: resueltos,
        requierenAccion: requierenAccion,
        grupos: grupos,
        ultimaActualizacion: Datos.ultimaActualizacionDe(bloqueos)
      };
    },

    ultimaActualizacionDe: function (bloqueos) {
      var max = null;
      bloqueos.forEach(function (b) {
        var f = aFecha(b.ultima_actualizacion);
        if (f && (!max || f > max.valor)) max = { valor: f, texto: b.ultima_actualizacion };
      });
      return max ? max.texto : "";
    },

    /* --- Estado y responsable ----------------------------------------- */

    /* El responsable real: si hay subestado, manda el subestado. */
    responsableDe: function (bloqueo) {
      var sub = SUBESTADOS[bloqueo.subestado];
      if (bloqueo.estado === "en_transito" && sub) return sub.responsable;
      return bloqueo.responsable || ESTADOS[bloqueo.estado].responsablePorDefecto;
    },

    /* --- Escritura (panel institucional) ------------------------------ */

    /* Guardar cambia el estado, actualiza la fecha y AÑADE un evento al
       historial. Las tres cosas siempre juntas: nunca cambia un estado sin
       dejar rastro, y nunca borra lo que ya estaba. */
    actualizarBloqueo: function (codigo, cambio) {
      var base = Datos.bloqueoPorId(codigo);
      if (!base) return { ok: false, error: "No encontramos ese caso." };

      var estado    = cambio.estado || base.estado;
      var subestado = (estado === "en_transito") ? (cambio.subestado || "") : "";
      var sub       = SUBESTADOS[subestado];

      var responsable = sub ? sub.responsable
                            : (cambio.responsable || ESTADOS[estado].responsablePorDefecto);

      var guia = base.guia_id;
      if (estado === "gestion_ciudadano") guia = "GUIA-GESTION";
      else if (estado === "en_juzgado")   guia = "GUIA-JUZGADO-ESPERA";
      else if (estado === "levantado")    guia = "GUIA-LEVANTADO";
      else if (estado === "en_transito")  guia = sub ? sub.guia : "GUIA-TRANSITO-PRESENTAR";

      var hoy = cambio.fecha || fechaDeHoy();

      var almacen = Datos.cambios();
      almacen.bloqueos[codigo] = {
        estado: estado,
        subestado: subestado,
        responsable: responsable,
        proxima_accion: cambio.proxima_accion || base.proxima_accion,
        detalle: cambio.nota || base.detalle,
        ultima_actualizacion: hoy,
        guia_id: guia
      };
      almacen.historial.push({
        id: "H-USR-" + Date.now(),
        bloqueo_id: codigo,
        fecha: hoy,
        titulo: cambio.titulo || ("Actualización: " + ESTADOS[estado].etiqueta),
        detalle: cambio.nota || "",
        fuente: cambio.fuente || "Juzgado DEMO",
        estado_resultante: estado
      });

      var ok = Guardado.escribir(LLAVE_CAMBIOS, almacen);
      if (!ok) {
        return { ok: false, error: "Tu navegador no permitió guardar. Prueba fuera del modo privado." };
      }
      return { ok: true, bloqueo: Datos.bloqueoPorId(codigo) };
    },

    /* --- Multas vehiculares por placa (simuladas) --------------------- */
    /* Una multa vehicular pertenece a una PLACA. No es un bloqueo de
       licencia y no dice nada de la persona titular. Esta sección nunca lee
       la sesión ni devuelve nombres, DPI ni bloqueos. */

    portales: function () {
      return global.DATOS.portales.slice();
    },
    portalPorId: function (id) {
      return buscar(global.DATOS.portales, id);
    },
    tiposDePlaca: function () {
      return global.DATOS.tipos_placa.slice();
    },
    infraccionPorId: function (id) {
      return buscar(global.DATOS.infracciones, id);
    },
    fuentesDeMontos: function () {
      return global.DATOS.infracciones.filter(function (i) { return !i.solo_demo; });
    },

    /* Deja la placa como la piden los portales: mayúsculas y sin espacios
       ni guiones. Así "p-123 abc" y "P123ABC" encuentran lo mismo. */
    normalizarPlaca: function (texto) {
      return String(texto || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    },

    /* Multa lista para mostrar: con su infracción, municipalidad y portal.
       "monto" es el monto base del Reglamento, o null si no se conoce. */
    multaPorId: function (id) {
      var m = buscar(global.DATOS.multas, id);
      return m ? Datos.completarMulta(m) : null;
    },
    completarMulta: function (m) {
      var inf = Datos.infraccionPorId(m.infraccion_id) || null;
      var monto = (inf && typeof inf.monto === "number" && isFinite(inf.monto)) ? inf.monto : null;
      return {
        multa: copiar(m),
        infraccion: inf,
        monto: monto,
        municipalidad: Datos.municipalidadPorId(m.municipalidad_id),
        portal: Datos.portalPorId(m.portal_id)
      };
    },

    /* Total pendiente: suma SOLO multas pendientes, con monto conocido y
       sin repetir la misma multa. Un monto desconocido no vale Q 0: se
       cuenta aparte para avisarlo. */
    totalPendiente: function (lista) {
      var vistos = {}, total = 0, conMonto = 0, sinMonto = 0;
      lista.forEach(function (e) {
        var id = e.multa.id;
        if (vistos[id]) return;
        vistos[id] = true;
        if (e.multa.estado_pago !== "pendiente") return;
        if (e.monto === null) { sinMonto++; return; }
        total += e.monto; conMonto++;
      });
      return { total: total, conMonto: conMonto, sinMonto: sinMonto };
    },

    /* Busca las multas de ejemplo de una placa.
       IMPORTANTE: esto NO consulta ningún portal real. Los portales de
       terceros no permiten consultas automatizadas; ver el aviso en la
       pantalla de consulta. */
    consultarPlaca: function (placa, tipo) {
      var limpia = Datos.normalizarPlaca(placa);
      /* Si la persona escribió el tipo dentro de la placa ("P123ABC"),
         lo quitamos para que igual encuentre el registro. */
      if (tipo && limpia.indexOf(tipo) === 0) {
        var resto = limpia.substring(tipo.length);
        if (buscarMultasPlaca(resto, tipo).length > 0) limpia = resto;
      }

      /* Sin duplicados: la misma multa solo aparece una vez. */
      var vistos = {};
      var encontrados = [];
      buscarMultasPlaca(limpia, tipo).forEach(function (m) {
        if (vistos[m.id]) return;
        vistos[m.id] = true;
        encontrados.push(Datos.completarMulta(m));
      });

      /* Pendientes primero y, dentro de cada grupo, la más reciente primero. */
      encontrados.sort(function (a, b) {
        var pa = a.multa.estado_pago === "pendiente" ? 0 : 1;
        var pb = b.multa.estado_pago === "pendiente" ? 0 : 1;
        if (pa !== pb) return pa - pb;
        return (aFecha(b.multa.fecha) || 0) - (aFecha(a.multa.fecha) || 0);
      });

      /* Agrupamos por municipalidad: primero las que tienen pendientes. */
      var grupos = [], indice = {};
      encontrados.forEach(function (e) {
        var id = e.multa.municipalidad_id;
        if (!indice[id]) {
          indice[id] = { municipalidad: e.municipalidad, multas: [], portales: [] };
          grupos.push(indice[id]);
        }
        indice[id].multas.push(e);
        if (e.portal && indice[id].portales.indexOf(e.portal) === -1) {
          indice[id].portales.push(e.portal);
        }
      });
      grupos.forEach(function (g) {
        g.pendientes = g.multas.filter(function (e) { return e.multa.estado_pago === "pendiente"; }).length;
      });
      grupos.sort(function (a, b) {
        if (a.pendientes !== b.pendientes) return b.pendientes - a.pendientes;
        return a.municipalidad.nombre.localeCompare(b.municipalidad.nombre, "es");
      });

      /* Si con este tipo no hay nada pero la misma placa existe con otro
         tipo, lo decimos. Elegir mal el tipo es un tropiezo muy común y
         hace creer a la persona que no tiene nada pendiente. */
      var sugerencias = [];
      if (encontrados.length === 0) {
        global.DATOS.multas.forEach(function (m) {
          if (Datos.normalizarPlaca(m.placa) === limpia &&
              m.tipo_placa !== tipo &&
              sugerencias.indexOf(m.tipo_placa) === -1) {
            sugerencias.push(m.tipo_placa);
          }
        });
      }

      var pendientes = encontrados.filter(function (e) { return e.multa.estado_pago === "pendiente"; });
      var pagadas    = encontrados.filter(function (e) { return e.multa.estado_pago === "pagada"; });

      return {
        placa: limpia,
        tipo: tipo,
        encontrados: encontrados,
        grupos: grupos,
        pendientes: pendientes.length,
        pagadas: pagadas.length,
        total: Datos.totalPendiente(encontrados),
        sugerencias: sugerencias
      };
    },

    /* Borra lo guardado por la demo y vuelve a la semilla original. */
    reiniciar: function () {
      Guardado.borrar(LLAVE_CAMBIOS);
      Guardado.borrar(LLAVE_PLACA);
      Sesion.salir();
    },

    hayCambiosGuardados: function () {
      var c = Datos.cambios();
      return Object.keys(c.bloqueos).length > 0 || c.historial.length > 0;
    },

    almacenamientoDisponible: function () {
      return Guardado.disponible();
    }
  };

  /* ============================================================== Ui === */

  var Ui = {

    /* Escapa texto antes de meterlo en HTML. */
    esc: function (texto) {
      return String(texto === undefined || texto === null ? "" : texto)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    },

    estado: function (clave) {
      return ESTADOS[clave] || ESTADOS.gestion_ciudadano;
    },
    subestado: function (clave) {
      return SUBESTADOS[clave] || null;
    },
    listaEstados: function () {
      return [ESTADOS.gestion_ciudadano, ESTADOS.en_juzgado, ESTADOS.en_transito, ESTADOS.levantado];
    },
    listaSubestados: function () {
      return [SUBESTADOS.orden_sin_presentar, SUBESTADOS.solicitud_presentada, SUBESTADOS.con_observacion];
    },

    /* Chip con icono + texto + color. Nunca solo color. */
    chipEstado: function (bloqueo, opciones) {
      opciones = opciones || {};
      var est = Ui.estado(bloqueo.estado);
      var sub = (bloqueo.estado === "en_transito") ? SUBESTADOS[bloqueo.subestado] : null;
      var color = sub && opciones.usarColorSubestado ? sub.color : est.color;
      var icono = sub && opciones.usarColorSubestado ? sub.icono : est.icono;
      var texto = opciones.corto ? est.etiquetaCorta : est.etiqueta;
      return '<span class="chip chip--' + color + '">' +
               '<span class="chip-icono" aria-hidden="true">' + icono + '</span>' +
               Ui.esc(texto) +
             '</span>';
    },

    /* Texto completo del estado, con subestado si lo hay. */
    textoEstado: function (bloqueo) {
      var est = Ui.estado(bloqueo.estado);
      var sub = (bloqueo.estado === "en_transito") ? SUBESTADOS[bloqueo.subestado] : null;
      return sub ? est.etiqueta + " · " + sub.etiqueta : est.etiqueta;
    },

    /* Clase del bloque grande "qué tienes que hacer ahora". */
    claseAccion: function (bloqueo) {
      var responsable = Datos.responsableDe(bloqueo);
      if (bloqueo.estado === "levantado") return "accion-ahora--listo";
      if (responsable === "Ciudadano")    return "";       /* ámbar = te toca */
      if (bloqueo.estado === "en_juzgado") return "accion-ahora--espera";
      return "accion-ahora--transito";
    },

    /* Color estable por municipalidad: la misma siempre sale del mismo color,
       para que el ojo la reconozca entre pantallas. Es identidad, no estado. */
    colorMuni: function (municipalidadId) {
      var lista = global.DATOS.municipalidades.map(function (m) { return m.id; });
      var i = lista.indexOf(municipalidadId);
      if (i === -1) i = 0;
      return "var(--muni-" + ((i % 6) + 1) + ")";
    },

    /* Iniciales de una municipalidad: "Municipalidad de Villa Nueva" -> "VN" */
    inicialesMuni: function (nombre) {
      var palabras = String(nombre || "").replace(/Municipalidad de /i, "").split(/\s+/);
      var letras = palabras.filter(function (p) { return p.length > 2; })
                           .map(function (p) { return p.charAt(0).toUpperCase(); });
      return letras.slice(0, 2).join("") || "M";
    },

    /* Formato de quetzales: 1000 -> "Q 1,000.00". null -> null (no es 0). */
    quetzales: function (monto) {
      if (typeof monto !== "number" || !isFinite(monto)) return null;
      var partes = monto.toFixed(2).split(".");
      partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return "Q " + partes[0] + "." + partes[1];
    },

    /* "Artículo 181, numeral 34" */
    baseLegal: function (inf) {
      if (!inf || !inf.articulo) return "";
      var num = inf.numeral || "";
      var texto = "Artículo " + inf.articulo;
      if (num) texto += /^literal/.test(num) ? ", " + num : ", numeral " + num;
      return texto;
    },

    /* Estado de pago simulado, con icono + texto + color. */
    chipPago: function (estado) {
      if (estado === "pagada") {
        return '<span class="chip chip--listo"><span class="chip-icono" aria-hidden="true">✓</span>Pagada (simulado)</span>';
      }
      if (estado === "pendiente") {
        return '<span class="chip chip--accion"><span class="chip-icono" aria-hidden="true">●</span>Pendiente de pago (simulado)</span>';
      }
      return '<span class="chip"><span class="chip-icono" aria-hidden="true">?</span>Estado de pago sin dato</span>';
    },

    /* Etiqueta de servicio: distingue las dos consultas en todas partes. */
    servicio: function (clave, claro) {
      var s = clave === "licencia"
        ? { icono: "ID", texto: "Estado de la licencia · con identidad digital" }
        : { icono: "P", texto: "Multas vehiculares · por placa" };
      return '<span class="servicio servicio--' + (clave === "licencia" ? "licencia" : "multas") +
               (claro ? " servicio--claro" : "") + '">' +
               '<span class="servicio-icono" aria-hidden="true">' + s.icono + '</span>' + s.texto +
             '</span>';
    },

    /* Tarjeta de una multa vehicular. Muestra solo datos del vehículo y de
       la infracción: nunca datos de una persona. */
    tarjetaMulta: function (e) {
      var m = e.multa, inf = e.infraccion;
      var monto = Ui.quetzales(e.monto);
      var base = Ui.baseLegal(inf);
      var numeralPendiente = inf && inf.verificacion === "numeral_pendiente";

      return '<article class="multa' + (m.estado_pago === "pagada" ? " multa--pagada" : "") + '">' +
          '<div class="multa-arriba">' +
            Ui.chipPago(m.estado_pago) +
            '<span class="multa-ref">' + Ui.esc(m.fecha) + ' · <span class="nowrap">' + Ui.esc(m.referencia) + '</span></span>' +
          '</div>' +
          '<p class="multa-rotulo">Infracción</p>' +
          '<p class="multa-infraccion">' + Ui.esc(inf ? inf.conducta : "Sin dato de la infracción") + '</p>' +
          '<dl class="datos datos--compactos">' +
            '<div><dt>Monto base según el Reglamento</dt><dd class="monto">' +
              (monto ? Ui.esc(monto) : '<span class="pendiente">Pendiente de verificación</span>') + '</dd></div>' +
            '<div><dt>Artículo y numeral</dt><dd>' +
              (base
                ? Ui.esc(base) + (numeralPendiente ? ' <span class="pendiente">(numeral pendiente de verificación)</span>' : '')
                : '<span class="pendiente">Pendiente de verificación</span>') + '</dd></div>' +
            '<div><dt>Municipalidad</dt><dd>' + Ui.esc(e.municipalidad ? e.municipalidad.nombre : "Sin dato") + '</dd></div>' +
          '</dl>' +
          (numeralPendiente && inf.nota_verificacion
            ? '<p class="nota-verificacion">' + Ui.esc(inf.nota_verificacion) + '</p>' : '') +
          (monto === null
            ? '<p class="nota-verificacion">No conocemos el monto de esta multa. Por eso no se suma al total: un monto desconocido no equivale a Q 0.00.</p>' : '') +
        '</article>';
    },

    /* Dibuja una placa con su tipo, como en los formularios reales. */
    placa: function (tipo, numero) {
      return '<span class="placa-muestra">' +
               '<span class="tipo">' + Ui.esc(tipo) + '</span>' +
               Ui.esc(numero) +
             '</span>';
    },

    /* Cambia de pantalla. La versión de un solo archivo lo reemplaza para
       usar direcciones con almohadilla (#). */
    navegar: function (destino) {
      global.location.href = destino;
    },

    /* Lee ?clave=valor de la dirección. */
    parametro: function (clave) {
      var busqueda = global.location.search.substring(1);
      var partes = busqueda.split("&");
      for (var i = 0; i < partes.length; i++) {
        var par = partes[i].split("=");
        if (decodeURIComponent(par[0]) === clave) {
          return decodeURIComponent((par[1] || "").replace(/\+/g, " "));
        }
      }
      return "";
    },

    /* Pinta la cabecera con el nombre del ciudadano y el botón de salir. */
    pintarBarraCiudadano: function (ciudadano) {
      var caja = document.getElementById("barra-derecha");
      if (!caja) return;
      if (!ciudadano) { caja.innerHTML = ""; return; }
      caja.innerHTML =
        '<span class="pequeno suave">' + Ui.esc(ciudadano.nombre.split(" ")[0]) + '</span>' +
        '<button type="button" class="boton-texto" id="salir">Cerrar sesión</button>';
      var boton = document.getElementById("salir");
      if (boton) {
        boton.addEventListener("click", function () {
          Sesion.salir();
          Ui.navegar("#inicio");
        });
      }
    },

    /* Aviso permanente de demostración. */
    avisoDemo: function (texto) {
      return '<div class="aviso" role="note">' +
               '<span class="aviso-icono" aria-hidden="true">●</span>' +
               '<span>' + (texto || '<strong>Esto es una demostración.</strong> Los ciudadanos, licencias y casos son ficticios. No consultamos sistemas reales de Tránsito ni de los juzgados, no pagamos multas y no levantamos bloqueos.') + '</span>' +
             '</div>';
    }
  };

  /* ======================================================= Auxiliares === */

  function buscar(lista, id) {
    var r = null;
    lista.forEach(function (x) { if (x.id === id) r = x; });
    return r;
  }

  function buscarMultasPlaca(limpia, tipo) {
    if (!limpia) return [];
    return global.DATOS.multas.filter(function (m) {
      return Datos.normalizarPlaca(m.placa) === limpia &&
             (!tipo || m.tipo_placa === tipo);
    });
  }

  function copiar(objeto) {
    return JSON.parse(JSON.stringify(objeto));
  }

  /* Convierte "dd/mm/aaaa" en Date. Devuelve null si no se puede. */
  function aFecha(texto) {
    if (!texto) return null;
    var p = String(texto).split("/");
    if (p.length !== 3) return null;
    var d = new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
    return isNaN(d.getTime()) ? null : d;
  }

  function fechaDeHoy() {
    var d = new Date();
    var dd = String(d.getDate()).padStart(2, "0");
    var mm = String(d.getMonth() + 1).padStart(2, "0");
    return dd + "/" + mm + "/" + d.getFullYear();
  }

  /* ======================================================== Exportar === */

  global.Sesion = Sesion;
  global.Datos  = Datos;
  global.Ui     = Ui;
  global.ESTADOS_LC = ESTADOS;
  global.SUBESTADOS_LC = SUBESTADOS;

})(window);

</script>
<script>
/* ------------------------------------------------------------------ */
/*  Enrutador de la versión de un solo archivo.                        */
/*                                                                     */
/*  Cada pantalla está guardada como TEXTO en una plantilla. Al entrar  */
/*  se copia al contenedor y se ejecuta su guion. Solo una pantalla     */
/*  existe en el documento a la vez, así que los identificadores        */
/*  (#pagina, #contenido, #reiniciar…) nunca se repiten ni se cruzan.   */
/* ------------------------------------------------------------------ */
(function () {
  var RUTAS = {};
  var app = document.getElementById("app");

  /* En esta versión los parámetros viajan en la almohadilla:
     #caso?caso=BLQ-...   Sustituimos la lectura por una que entienda eso. */
  Ui.parametro = function (clave) {
    var h = location.hash.replace(/^#/, "");
    var i = h.indexOf("?");
    if (i === -1) return "";
    var partes = h.substring(i + 1).split("&");
    for (var k = 0; k < partes.length; k++) {
      var par = partes[k].split("=");
      if (decodeURIComponent(par[0]) === clave) {
        return decodeURIComponent((par[1] || "").replace(/\+/g, " "));
      }
    }
    return "";
  };

  /* Las navegaciones que hace app.js (cerrar sesión, pedir identidad) usan
     la almohadilla. Si el destino es la pantalla actual, se vuelve a pintar,
     porque cambiar a la misma almohadilla no dispara "hashchange". */
  Ui.navegar = function (destino) {
    var nuevo = String(destino).replace(/^#/, "");
    if (location.hash.replace(/^#/, "") === nuevo) { pintar(); return; }
    location.hash = nuevo;
  };

  RUTAS["inicio"] = function () {
  
  (function () {
    document.getElementById("aviso-demo").innerHTML = Ui.avisoDemo(
      '<strong>Esto es una demostración.</strong> Las placas, multas, personas, licencias y bloqueos son ficticios. ' +
      'Los montos de las multas son de referencia según el Reglamento de Tránsito. ' +
      'No consultamos sistemas reales, no cobramos multas y no levantamos bloqueos.');
  
    /* La portada es pública. Solo si la persona YA ingresó en esta pestaña
       se muestra su nombre arriba (con "Cerrar sesión") y el botón de la
       licencia lleva directo a su información. Una visita nueva nunca
       trae una sesión abierta: ver Sesion en js/app.js. */
    var ciu = Sesion.actual();
    Ui.pintarBarraCiudadano(ciu);
    if (ciu) document.getElementById("ir-licencia").setAttribute("href", "#mi-licencia");
  
    document.getElementById("reiniciar").addEventListener("click", function () {
      Datos.reiniciar();
      location.reload();
    });
  
    if (!Datos.almacenamientoDisponible()) {
      document.getElementById("aviso-guardado").textContent =
        "Aviso: tu navegador no permite guardar datos, así que los cambios del panel institucional no se conservarán al cambiar de pantalla.";
    }
  })();
  
  };
  RUTAS["identidad"] = function () {
  
  (function () {
    var mensaje = document.getElementById("mensaje");
    document.getElementById("etiqueta-servicio").innerHTML = Ui.servicio("licencia");
  
    /* Si ya ingresó en esta pestaña, lo decimos y ofrecemos seguir o salir.
       Una visita nueva nunca llega aquí con sesión (ver Sesion en app.js). */
    var yaDentro = Sesion.actual();
    if (yaDentro) {
      document.getElementById("sesion-abierta").innerHTML =
        '<div class="aviso aviso--neutro mb"><span class="aviso-icono" aria-hidden="true">●</span><span>' +
          'Ya ingresaste como <strong>' + Ui.esc(yaDentro.nombre) + '</strong>. ' +
          '<a href="#mi-licencia">Ver mi licencia</a> o ingresa con otro usuario de prueba.' +
        '</span></div>';
    }
  
    document.getElementById("ver-clave").addEventListener("change", function (e) {
      document.getElementById("clave").type = e.target.checked ? "text" : "password";
    });
    var campoUsuario = document.getElementById("usuario");
    var campoClave = document.getElementById("clave");
  
    /* Tabla de credenciales de prueba, para que la presentación sea rápida. */
    var filas = "";
    DATOS.ciudadanos.forEach(function (c) {
      filas += '<tr>' +
        '<td>' + Ui.esc(c.nombre) + '</td>' +
        '<td><button type="button" class="boton-texto usar" data-usuario="' + Ui.esc(c.usuario_demo) + '" data-clave="' + Ui.esc(c.clave_demo) + '">' + Ui.esc(c.usuario_demo) + '</button></td>' +
        '<td><code>' + Ui.esc(c.clave_demo) + '</code></td>' +
      '</tr>';
    });
    document.getElementById("tabla-credenciales").innerHTML = filas;
  
    Array.prototype.forEach.call(document.querySelectorAll(".usar"), function (b) {
      b.addEventListener("click", function () {
        campoUsuario.value = b.getAttribute("data-usuario");
        campoClave.value = b.getAttribute("data-clave");
        limpiarError();
        campoUsuario.focus();
      });
    });
  
    /* Si llegó aquí porque no tenía sesión, se lo explicamos. */
    if (Ui.parametro("motivo") === "sesion") {
      mensaje.innerHTML = '<div class="aviso aviso--neutro"><span class="aviso-icono" aria-hidden="true">●</span>' +
        '<span>Para ver tu licencia primero tienes que ingresar.</span></div>';
    }
  
    function limpiarError() {
      mensaje.innerHTML = "";
      campoUsuario.removeAttribute("aria-invalid");
      campoClave.removeAttribute("aria-invalid");
    }
  
    function mostrarError(texto, campo) {
      mensaje.innerHTML = '<div class="error"><span aria-hidden="true">⚠</span><span>' + Ui.esc(texto) + '</span></div>';
      if (campo) { campo.setAttribute("aria-invalid", "true"); campo.focus(); }
    }
  
    document.getElementById("formulario").addEventListener("submit", function (e) {
      e.preventDefault();
      limpiarError();
  
      var u = campoUsuario.value.trim();
      var c = campoClave.value;
  
      if (!u) { mostrarError("Escribe tu usuario. Por ejemplo: sofia.demo", campoUsuario); return; }
      if (!c) { mostrarError("Escribe tu contraseña. En esta demostración es: demo1234", campoClave); return; }
  
      var ciudadano = Sesion.entrar(u, c);
      if (!ciudadano) {
        mostrarError("El usuario o la contraseña no coinciden. Revisa que estén bien escritos (la contraseña de prueba es demo1234) o toca uno de los usuarios de la lista de arriba.", campoUsuario);
        return;
      }
  
      mensaje.innerHTML = '<div class="exito"><span aria-hidden="true">✓</span><span>Identidad confirmada. Abriendo el estado de tu licencia…</span></div>';
      setTimeout(function () { location.href = "#mi-licencia"; }, 700);
    });
  
    campoUsuario.addEventListener("input", limpiarError);
    campoClave.addEventListener("input", limpiarError);
  })();
  
  };
  RUTAS["mi-licencia"] = function () {
  
  (function () {
    var ciudadano = Sesion.exigir();
    if (!ciudadano) return;
  
    Ui.pintarBarraCiudadano(ciudadano);
  
    var r = Datos.resumenDe(ciudadano.id);
    var html = "";
  
    html +=
      '<a class="volver" href="#inicio"><span aria-hidden="true">←</span> Inicio</a>' +
      '<div class="mb">' + Ui.servicio("licencia") + '</div>';
  
    /* ---------------------------------------------- 1. Mi licencia ------- */
  
    html +=
      '<div class="tarjeta">' +
        '<div class="perfil">' +
          '<span class="avatar" aria-hidden="true">' + Ui.esc(ciudadano.iniciales) + '</span>' +
          '<div>' +
            '<h1 class="sin-margen">Estado de tu licencia</h1>' +
            '<p class="sin-margen perfil-nombre">' + Ui.esc(ciudadano.nombre) + '</p>' +
            '<p class="sin-margen pequeno suave">DPI de demostración ' + Ui.esc(ciudadano.cui_demo) + '</p>' +
          '</div>' +
        '</div>' +
        '<dl class="datos mt">' +
          '<div><dt>Número de licencia</dt><dd>' + Ui.esc(r.licencia.numero) + '</dd></div>' +
          '<div><dt>Tipo</dt><dd>' + Ui.esc(r.licencia.tipo) + '</dd></div>' +
          '<div><dt>Vence el</dt><dd>' + Ui.esc(r.licencia.fecha_vencimiento) + '</dd></div>' +
        '</dl>' +
        '<p class="pequeno suave mt sin-margen">El vencimiento de tu licencia es una fecha aparte. No es un bloqueo.</p>' +
        resumenNumeros(r) +
      '</div>';
  
    /* ------------------------------------------ 2. Municipalidades ------- */
  
    var conActivos = r.grupos.filter(function (g) { return g.activos.length > 0; });
  
    html += '<h2 class="mt2">Bloqueos de tu licencia, por municipalidad</h2>';
  
    if (r.activos.length === 0) {
      html +=
        '<div class="vacio">' +
          '<div class="vacio-icono" aria-hidden="true">✓</div>' +
          '<p><strong>Tu licencia no tiene bloqueos activos en esta demostración.</strong></p>' +
          '<p class="pequeno">Esto quiere decir que en los datos de esta demostración no aparece ningún bloqueo activo a tu nombre. No confirma que puedas renovar, conducir ni que estés solvente en todo el país.</p>' +
        '</div>';
    } else {
      html += '<p class="suave pequeno">Aparecen primero las municipalidades donde tú tienes que hacer algo.</p>';
      conActivos.forEach(function (g) { html += tarjetaMunicipalidad(g); });
    }
  
    /* -------------------------------------------------- 3. Resueltos ----- */
  
    if (r.resueltos.length > 0) {
      html +=
        '<details class="desplegable mt2">' +
          '<summary>Casos resueltos (' + r.resueltos.length + ')</summary>' +
          '<div class="desplegable-cuerpo">' +
            '<p class="pequeno suave">Estos bloqueos ya fueron levantados. Se conservan en tu historial.</p>' +
            r.resueltos.map(filaCasoResuelto).join("") +
          '</div>' +
        '</details>';
    }
  
    html +=
      '<p class="pequeno suave mt2">Última actualización de tus casos: <strong>' +
      (r.ultimaActualizacion ? Ui.esc(r.ultimaActualizacion) : "sin registros") + '</strong>. ' +
      'Los cambios que haga una institución aparecen aquí cuando actualizas la pantalla.</p>' +
      '<div class="botones botones--fila mt">' +
        '<button type="button" class="boton boton--secundario" id="actualizar">Actualizar</button>' +
      '</div>' +
      '<p class="nota-servicio mt">Esta pantalla muestra <strong>bloqueos de tu licencia</strong>. ' +
        'Las <strong>multas de un vehículo</strong> son otra consulta: ' +
        '<a href="#consulta-placa">consultar multas por placa</a>.</p>' +
      '<div class="mt2">' + Ui.avisoDemo() + '</div>';
  
    document.getElementById("pagina").innerHTML = html;
    document.getElementById("cargando").hidden = true;
    document.getElementById("pagina").hidden = false;
  
    document.getElementById("actualizar").addEventListener("click", function () {
      location.reload();
    });
  
    /* ============================================== Piezas de la vista === */
  
    function resumenNumeros(r) {
      var claseAccion = r.requierenAccion.length > 0 ? " resumen-caja--atencion" : "";
      return '<div class="resumen">' +
        '<div class="resumen-caja">' +
          '<div class="resumen-numero">' + r.activos.length + '</div>' +
          '<div class="resumen-texto">bloqueo' + (r.activos.length === 1 ? "" : "s") + ' activo' + (r.activos.length === 1 ? "" : "s") + '</div>' +
        '</div>' +
        '<div class="resumen-caja' + claseAccion + '">' +
          '<div class="resumen-numero">' + r.requierenAccion.length + '</div>' +
          '<div class="resumen-texto">' + (r.requierenAccion.length === 1 ? "necesita tu acción" : "necesitan tu acción") + '</div>' +
        '</div>' +
        '<div class="resumen-caja' + (r.resueltos.length > 0 ? " resumen-caja--listo" : "") + '">' +
          '<div class="resumen-numero">' + r.resueltos.length + '</div>' +
          '<div class="resumen-texto">ya resuelto' + (r.resueltos.length === 1 ? "" : "s") + '</div>' +
        '</div>' +
      '</div>';
    }
  
    function tarjetaMunicipalidad(g) {
      var chips = g.activos.map(function (b) {
        return Ui.chipEstado(b, { corto: true, usarColorSubestado: true });
      }).join("");
  
      /* La próxima acción de la municipalidad es la del primer caso que
         requiere acción del ciudadano; si no hay, la del primer caso activo. */
      var destacado = g.activos.filter(function (b) {

  RUTAS["consulta-placa"] = function () {
  
  (function () {
    /* Esta pantalla NO usa la sesión para nada más que la barra superior.
       Consultar una placa no identifica a nadie ni muestra al titular. */
    Ui.pintarBarraCiudadano(Sesion.actual());
    document.getElementById("etiqueta-servicio").innerHTML = Ui.servicio("multas", true);
  
    var portales   = Datos.portales();
    var campoTipo  = document.getElementById("placa-tipo");
    var campoPlaca = document.getElementById("placa-numero");
    var mensaje    = document.getElementById("mensaje");
  
    var faseFormulario = document.getElementById("fase-formulario");
    var faseConsulta   = document.getElementById("fase-consulta");
    var faseResultados = document.getElementById("fase-resultados");
  
    var menosMovimiento = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  
    /* ------------------------------------------------ Preparar el formulario */
  
    campoTipo.innerHTML = Datos.tiposDePlaca().map(function (t) {
      return '<option value="' + Ui.esc(t) + '"' + (t === "P" ? " selected" : "") + '>' + Ui.esc(t) + '</option>';
    }).join("");
  
    document.getElementById("lista-portales-estatica").innerHTML =
      portales.map(function (p) { return filaPortal(p, "", true); }).join("");
  
    document.getElementById("placas-prueba").innerHTML =
      [["P", "123ABC"], ["P", "456DEF"], ["M", "2244BC"], ["P", "9090XY"], ["P", "789GHI"]].map(function (par) {
        return '<button type="button" class="boton boton--secundario prueba" data-tipo="' + par[0] +
               '" data-placa="' + par[1] + '">' + par[0] + '-' + par[1] + '</button>';
      }).join("");
  
    Array.prototype.forEach.call(document.querySelectorAll(".prueba"), function (b) {
      b.addEventListener("click", function () {
        campoTipo.value = b.getAttribute("data-tipo");
        campoPlaca.value = b.getAttribute("data-placa");
        limpiarError();
        campoPlaca.focus();
      });
    });
  
    /* A propósito NO recordamos la consulta anterior. Si dejáramos puesto el
       tipo de la vez pasada, alguien podría escribir su placa nueva, obtener
       "sin resultados" por el tipo equivocado y creer que no debe nada. */
  
    /* ------------------------------------------------------------ Validación */
  
    function limpiarError() {
      mensaje.innerHTML = "";
      campoPlaca.removeAttribute("aria-invalid");
    }
  
    function mostrarError(texto) {
      mensaje.innerHTML = '<div class="error"><span aria-hidden="true">⚠</span><span>' + Ui.esc(texto) + '</span></div>';
      campoPlaca.setAttribute("aria-invalid", "true");
      campoPlaca.focus();
    }
  
    campoPlaca.addEventListener("input", limpiarError);
  
    document.getElementById("formulario").addEventListener("submit", function (e) {
      e.preventDefault();
      limpiarError();
  
      var tipo = campoTipo.value;
      var texto = Datos.normalizarPlaca(campoPlaca.value);
  
      if (!texto) {
        mostrarError("Falta el número de placa. Escríbelo como aparece en la placa o en la tarjeta de circulación. Ejemplo: 123ABC.");
        return;
      }
      if (texto.length < 4) {
        mostrarError("El número parece incompleto: tiene " + texto.length + (texto.length === 1 ? " carácter" : " caracteres") + ". Revisa la placa y escríbelo completo. Ejemplo: 123ABC.");
        return;
      }
  
      consultar(tipo, texto);
    });
  
    /* ------------------------------------------- La consulta simulada */
  
    function consultar(tipo, placa) {
      faseFormulario.hidden = true;
      faseResultados.hidden = true;
      faseConsulta.hidden = false;
      window.scrollTo(0, 0);
      document.getElementById("titulo-consulta").focus();
  
      document.getElementById("subtitulo-consulta").innerHTML =
        "Placa " + Ui.placa(tipo, placa) + " · " + portales.length + " portales";
  
      var lista = document.getElementById("lista-portales");
      lista.innerHTML = portales.map(function (p) { return filaPortal(p, "pendiente", false); }).join("");
  
      var barra = document.getElementById("avance");
      var contenedorBarra = barra.parentNode;
      var aviso = document.getElementById("estado-consulta");
  
      /* Sabemos de antemano qué portales "encuentran" algo, para marcarlos. */
      var resultado = Datos.consultarPlaca(placa, tipo);
      var conHallazgo = {};
      resultado.encontrados.forEach(function (e) {
        if (e.portal) conHallazgo[e.portal.id] = (conHallazgo[e.portal.id] || 0) + 1;
      });
  
      var i = 0;
      var paso = menosMovimiento ? 90 : 300;
  
      function siguiente() {
        if (i > 0) {
          var anterior = lista.children[i - 1];
          var idAnterior = portales[i - 1].id;
          anterior.className = "portal " + (conHallazgo[idAnterior] ? "portal--hallazgo" : "portal--listo");
          anterior.querySelector(".portal-luz").textContent = conHallazgo[idAnterior] ? "!" : "✓";
          anterior.querySelector(".portal-marca").textContent =
            conHallazgo[idAnterior]
              ? conHallazgo[idAnterior] + (conHallazgo[idAnterior] === 1 ? " multa" : " multas")
              : "Sin multas";
        }
  
        var porcentaje = Math.round((i / portales.length) * 100);
        barra.style.width = porcentaje + "%";
        contenedorBarra.setAttribute("aria-valuenow", String(porcentaje));
  
        if (i >= portales.length) {
          aviso.textContent = "Consulta terminada.";
          setTimeout(function () { mostrarResultados(resultado); }, menosMovimiento ? 0 : 350);
          return;
        }
  
        var fila = lista.children[i];
        fila.className = "portal portal--consultando";
        fila.querySelector(".portal-luz").textContent = "•";
        fila.querySelector(".portal-marca").textContent = "Revisando…";
        /* Solo anunciamos cada tres portales para no saturar a quien usa lector de pantalla. */
        if (i % 3 === 0) {
          aviso.textContent = "Revisando portales: " + (i + 1) + " de " + portales.length + ".";
        }
  
        i++;
        setTimeout(siguiente, paso);
      }
  
      siguiente();
    }
  
    /* ----------------------------------------------------------- Resultados */
  
    function mostrarResultados(r) {
      faseConsulta.hidden = true;
      faseResultados.hidden = false;
      window.scrollTo(0, 0);
  
      var html = "";
      var n = r.encontrados.length;
  
      html +=
        '<div class="resultado-cabecera resultado-cabecera--multas">' +
          '<h2 id="titulo-resultados" tabindex="-1">' +
            (n === 0 ? "No encontramos multas" : (n === 1 ? "1 multa encontrada" : n + " multas encontradas")) +
          '</h2>' +
          '<p>Revisamos ' + portales.length + ' portales municipales para esta placa:</p>' +
          Ui.placa(r.tipo, r.placa) +
        '</div>';
  
      if (n === 0) {
        html +=
          '<div class="vacio">' +
            '<div class="vacio-icono" aria-hidden="true">✓</div>' +
            '<p><strong>No se encontraron multas para esta placa en los portales de esta demostración.</strong></p>' +
            '<p class="pequeno">En Guatemala hay más de 300 municipios y no todos publican un portal de consulta. ' +
            'Esto no confirma que el vehículo esté solvente en todo el país.</p>' +
          '</div>';
  
        /* Tropiezo frecuente: el tipo de placa equivocado. */
        if (r.sugerencias && r.sugerencias.length > 0) {
          html += '<div class="aviso mt"><span class="aviso-icono" aria-hidden="true">●</span><span>' +
            '<strong>Revisa el tipo de placa.</strong> Buscamos <strong>' + Ui.esc(r.tipo) + '-' + Ui.esc(r.placa) +
            '</strong>, pero sí hay multas para ese mismo número con ' +
            (r.sugerencias.length === 1 ? 'el tipo ' : 'los tipos ') +
            r.sugerencias.map(function (t) { return "<strong>" + Ui.esc(t) + "</strong>"; }).join(" o ") + '. ' +
            r.sugerencias.map(function (t) {
              return '<button type="button" class="boton-texto reintentar" data-tipo="' + Ui.esc(t) +
                     '">Buscar ' + Ui.esc(t) + '-' + Ui.esc(r.placa) + '</button>';
            }).join(" · ") +
            '</span></div>';
        }
      } else {
        html += resumenTotal(r);
        r.grupos.forEach(function (g) { html += tarjetaGrupo(g); });
      }
  
      html +=
        '<div class="botones botones--fila mt2 no-imprimir">' +
          '<button type="button" class="boton boton--multas" id="otra">Consultar otra placa</button>' +
          '<a class="boton boton--secundario" href="#inicio">Volver al inicio</a>' +
        '</div>' +
        '<p class="nota-servicio mt">¿Quieres saber si <strong>tu licencia</strong> tiene bloqueos? Eso es otra consulta: ' +
          '<a href="#identidad">ingresa con tu identidad digital</a>.</p>';
  
      html +=
        '<div class="aviso aviso--jurado mt" role="note">' +
          '<span class="aviso-icono" aria-hidden="true">⚠</span>' +
          '<span><strong>DEMO:</strong> los portales reales no permiten consultas automatizadas. ' +
          'Esta simulación muestra cómo funcionaría Licencia Clara si las instituciones ' +
          'expusieran APIs públicas. Las multas y su estado de pago son ficticios.</span>' +
        '</div>';
  
      html +=
        '<details class="desplegable mt">' +
          '<summary>Ver los portales reales y consultarlos por tu cuenta</summary>' +
          '<div class="desplegable-cuerpo">' +
            '<ul class="portales">' + portales.map(enlacePortal).join("") + '</ul>' +
          '</div>' +
        '</details>';
  
      faseResultados.innerHTML = html;
      document.getElementById("titulo-resultados").focus();
  
      document.getElementById("otra").addEventListener("click", function () {
        faseResultados.hidden = true;
        faseFormulario.hidden = false;
        window.scrollTo(0, 0);
        campoPlaca.focus();
        campoPlaca.select();
      });
  
      Array.prototype.forEach.call(faseResultados.querySelectorAll(".reintentar"), function (b) {
        b.addEventListener("click", function () {
          var t = b.getAttribute("data-tipo");
          campoTipo.value = t;
          campoPlaca.value = r.placa;
          consultar(t, r.placa);
        });
      });
    }
  
    /* Total: solo pendientes con monto conocido, sin duplicados. */
    function resumenTotal(r) {
      var t = r.total;
      var html = '<div class="tarjeta total">';
  
      if (r.pendientes === 0) {
        html +=
          '<p class="total-rotulo">Multas pendientes de pago</p>' +
          '<p class="total-cifra total-cifra--listo"><span aria-hidden="true">✓ </span>Ninguna</p>' +
          '<p class="pequeno suave sin-margen">' +
            (r.pagadas === 1 ? "La multa encontrada aparece como pagada" : "Las " + r.pagadas + " multas encontradas aparecen como pagadas") +
            ' en esta demostración. Se muestran abajo como historial.</p>';
      } else {
        html +=
          '<p class="total-rotulo">Total pendiente en esta demostración</p>' +
          (t.conMonto > 0
            ? '<p class="total-cifra">' + Ui.esc(Ui.quetzales(t.total)) + '</p>'
            : '<p class="total-cifra total-cifra--pendiente">Monto pendiente de verificación</p>') +
          '<ul class="total-lista">' +
            (t.conMonto > 0
              ? '<li>Suma ' + (t.conMonto === 1 ? "1 multa pendiente" : t.conMonto + " multas pendientes") + ' con monto conocido.</li>' : '') +
            (t.sinMonto > 0
              ? '<li><strong>' + (t.sinMonto === 1 ? "1 multa pendiente no tiene" : t.sinMonto + " multas pendientes no tienen") +
                ' monto confirmado</strong> y no se incluye' + (t.sinMonto === 1 ? "" : "n") + ' en el total.</li>' : '') +
            (r.pagadas > 0
              ? '<li>' + (r.pagadas === 1 ? "1 multa pagada no se suma." : r.pagadas + " multas pagadas no se suman.") + '</li>' : '') +
          '</ul>' +
          '<p class="pequeno suave sin-margen">Usamos el <strong>monto base del Reglamento de Tránsito</strong> de cada infracción. ' +
            'Las multas son ficticias: no es una deuda real y no incluye descuentos, intereses ni recargos. ' +
            'El monto a pagar lo confirma la municipalidad.</p>';
      }
      return html + '</div>';
    }
  
    function tarjetaGrupo(g) {
      var color = Ui.colorMuni(g.municipalidad.id);
      var sellos = g.portales.map(function (p) {
        return '<span class="sello-portal"><span class="punto" aria-hidden="true"></span>Encontrado en ' + Ui.esc(p.nombre) + '</span>';
      }).join(" ");
  
      var cuenta = g.multas.length + (g.multas.length === 1 ? " multa" : " multas");
      if (g.pendientes > 0) cuenta += " · " + g.pendientes + (g.pendientes === 1 ? " pendiente" : " pendientes");
  
      return '<section class="tarjeta tarjeta--muni" style="--color-muni:' + color + '">' +
        '<div class="muni-encabezado">' +
          '<span class="muni-sello" aria-hidden="true">' + Ui.esc(Ui.inicialesMuni(g.municipalidad.nombre)) + '</span>' +
          '<div>' +
            '<h3 class="sin-margen">' + Ui.esc(g.municipalidad.nombre) + '</h3>' +
            '<p class="pequeno suave sin-margen">' + cuenta + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="chips mt">' + sellos + '</div>' +
        g.multas.map(function (e) { return Ui.tarjetaMulta(e); }).join("") +
      '</section>';
    }
  
    /* --------------------------------------------------------- Piezas HTML */
  
    function filaPortal(p, clase, conEnlace) {
      var marca = "";
      if (conEnlace) {
        if (p.estado_revision === "responde") marca = "Responde";
        else if (p.estado_revision === "sin_https") marca = "Solo http";
        else marca = "No verificado";
      }
      return '<li class="portal">' +
        '<span class="portal-luz" aria-hidden="true">' + (conEnlace ? "·" : "") + '</span>' +
        '<span class="portal-texto">' +
          '<span class="portal-nombre">' + Ui.esc(p.nombre) + '</span>' +
          '<span class="portal-lugar">' + Ui.esc(p.lugar) + '</span>' +
        '</span>' +
        '<span class="portal-marca">' + Ui.esc(marca) + '</span>' +
      '</li>';
    }
  
    function enlacePortal(p) {
      var nota = p.estado_revision === "responde"
        ? "La página cargó cuando la revisamos el 10/09/2026."
        : (p.estado_revision === "sin_https"
            ? "Responde solo por http: tu navegador puede advertir que el sitio no es seguro."
            : "No pudimos comprobar que estuviera activo el día de la revisión.");
      return '<li class="portal">' +
        '<span class="portal-luz" aria-hidden="true">→</span>' +
        '<span class="portal-texto">' +
          '<span class="portal-nombre"><a href="' + Ui.esc(p.url) + '" target="_blank" rel="noopener">' + Ui.esc(p.nombre) +
            '<span class="solo-lectores"> (se abre en otra pestaña)</span></a></span>' +
          '<span class="portal-lugar">' + Ui.esc(p.lugar) + ' · ' + Ui.esc(nota) + '</span>' +
        '</span>' +
      '</li>';
    }
  })();
  
  };

      if (bloqueos.length === 0) {

        });
      });

      var b = Datos.bloqueoPorId(abierto);

      var opcionesEstado = Ui.listaEstados().map(function (e) {

                 Ui.esc(s.etiqueta) + '</option>';

      editor.innerHTML =
        '<div class="tarjeta">' +
          '<h2>3. Bloqueo ' + Ui.esc(b.id) + '</h2>' +
          '<p class="pequeno suave">' + Ui.esc(muni.nombre) + ' · ' + Ui.esc(Datos.juzgadoPorId(b.juzgado_id).nombre) + '</p>' +
  
          '<div class="campo mt">' +
            '<label for="estado">4. Nuevo estado</label>' +
            '<select id="estado">' + opcionesEstado + '</select>' +
          '</div>' +
  
          '<div class="campo" id="caja-sub"' + (b.estado === "en_transito" ? "" : " hidden") + '>' +
            '<label for="subestado">Detalle del estado en Tránsito</label>' +
            '<p class="ayuda">Sin este detalle, "Pendiente en Tránsito" esconde si al ciudadano todavía le toca presentar la solicitud.</p>' +
            '<select id="subestado">' + opcionesSub + '</select>' +
          '</div>' +
  
          '<div class="campo">' +
            '<label for="proxima">Próxima acción para el ciudadano</label>' +
            '<p class="ayuda">Una frase, en lenguaje sencillo.</p>' +
            '<input type="text" id="proxima" value="' + Ui.esc(b.proxima_accion) + '">' +
          '</div>' +
  
          '<div class="campo">' +
            '<label for="nota">5. Escribe la actualización</label>' +
            '<p class="ayuda">Se agrega al historial del caso. Lo anterior no se borra.</p>' +
            '<textarea id="nota" placeholder="Ejemplo: el juzgado emitió el oficio de desbloqueo y está listo para ser retirado."></textarea>' +
          '</div>' +
  
          '<div class="campo">' +
            '<label for="fuente">Quién hace esta actualización</label>' +
            '<select id="fuente">' +
              '<option value="Juzgado DEMO">Juzgado DEMO</option>' +
              '<option value="Tránsito DEMO">Tránsito DEMO</option>' +
            '</select>' +
          '</div>' +
  
          '<div id="aviso-levantado"></div>' +
  
          '<button type="button" class="boton boton--bloque" id="guardar">6. Guardar</button>' +
          '<div id="resultado" aria-live="polite">' + mensajeGuardado + '</div>' +
  
          '<details class="desplegable mt">' +
            '<summary>Ver el historial actual (' + Datos.historialDe(b.id).length + ' eventos)</summary>' +
            '<div class="desplegable-cuerpo">' +
              '<ul class="linea">' + Datos.historialDe(b.id).map(function (h, i) {
                return '<li' + (i === 0 ? ' class="reciente"' : '') + '>' +
                  '<div class="fecha">' + Ui.esc(h.fecha) + '</div>' +
                  '<div class="titulo">' + Ui.esc(h.titulo) + '</div>' +
                  (h.detalle ? '<div class="pequeno suave">' + Ui.esc(h.detalle) + '</div>' : '') +
                  '<span class="fuente">' + Ui.esc(h.fuente) + '</span></li>';
              }).join("") + '</ul>' +
            '</div>' +
          '</details>' +
        '</div>';
  
      var campoEstado = document.getElementById("estado");
      var cajaSub = document.getElementById("caja-sub");
      var avisoLevantado = document.getElementById("aviso-levantado");
  
      function revisarEstado() {
        cajaSub.hidden = (campoEstado.value !== "en_transito");
        avisoLevantado.innerHTML = (campoEstado.value === "levantado")
          ? '<div class="aviso"><span class="aviso-icono" aria-hidden="true">●</span><span>' +
            'Estás marcando el bloqueo como <strong>levantado</strong>. En el mundo real esto solo lo puede hacer ' +
            'el Departamento de Tránsito al emitir la resolución. Ni el pago de la multa ni la orden del juzgado ' +
            'producen este estado por sí solos.</span></div>'
          : "";
      }
      campoEstado.addEventListener("change", revisarEstado);
      revisarEstado();
  
      document.getElementById("guardar").addEventListener("click", function () {
        var resultado = document.getElementById("resultado");
        var nota = document.getElementById("nota").value.trim();
        var proxima = document.getElementById("proxima").value.trim();
  
        if (!nota) {
          mensajeGuardado = "";
          resultado.innerHTML = '<div class="error"><span aria-hidden="true">⚠</span><span>Escribe la actualización antes de guardar. Es lo que verá el ciudadano en su historial.</span></div>';
          document.getElementById("nota").focus();
          return;
        }
        if (!proxima) {
          mensajeGuardado = "";
          resultado.innerHTML = '<div class="error"><span aria-hidden="true">⚠</span><span>Escribe cuál es la próxima acción para el ciudadano.</span></div>';
          document.getElementById("proxima").focus();
          return;
        }
  
        var r = Datos.actualizarBloqueo(abierto, {
          estado: campoEstado.value,
          subestado: document.getElementById("subestado") ? document.getElementById("subestado").value : "",
          proxima_accion: proxima,
          nota: nota,
          fuente: document.getElementById("fuente").value
        });
  
        if (!r.ok) {
          mensajeGuardado = "";
          resultado.innerHTML = '<div class="error"><span aria-hidden="true">⚠</span><span>' + Ui.esc(r.error) + '</span></div>';
          return;
        }
  
        mensajeGuardado = '<div class="exito"><span aria-hidden="true">✓</span><span>' +
          'Guardado. El caso quedó en "' + Ui.esc(Ui.textoEstado(r.bloqueo)) + '" y se agregó un evento al historial. ' +
          'El ciudadano lo verá al actualizar su pantalla.</span></div>';
  
        /* Redibujamos para que la lista y el historial muestren lo nuevo.
           El mensaje se vuelve a pintar porque vive fuera del HTML. */
        pintarLista();
      });
    }
  
    document.getElementById("reiniciar").addEventListener("click", function () {
      Datos.reiniciar();
      abierto = "";
      mensajeGuardado = "";
      pintarLista();
      document.getElementById("aviso-reinicio").innerHTML =
        '<div class="exito mt"><span aria-hidden="true">✓</span><span>Datos restablecidos. La demostración vuelve a empezar desde cero.</span></div>';
    });
  
    pintarLista();
  })();
  
  };

  function nombreActual() {
    var h = location.hash.replace(/^#/, "");
    var i = h.indexOf("?");
    if (i !== -1) h = h.substring(0, i);
    return RUTAS[h] ? h : "inicio";
  }

  function pintar() {
    var nombre = nombreActual();
    var plantilla = document.getElementById("tpl-" + nombre);
    app.innerHTML = plantilla.textContent;
    document.body.className = plantilla.getAttribute("data-clase") || "";
    try { RUTAS[nombre](); } catch (e) { console.error(e); }
    window.scrollTo(0, 0);
  }

  /* "Saltar al contenido" mueve el foco en vez de cambiar la almohadilla. */
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("[data-saltar]") : null;
    if (!a) return;
    e.preventDefault();
    var destino = document.getElementById("contenido");
    if (destino) { destino.setAttribute("tabindex", "-1"); destino.focus(); }
  });

  window.addEventListener("hashchange", pintar);
  pintar();
})();
</script>

</body>
</html>
