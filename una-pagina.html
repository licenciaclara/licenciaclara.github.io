<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licencia Clara · Multas vehiculares y estado de tu licencia</title>
<meta name="description" content="Demostración con datos ficticios para consultar multas vehiculares por placa y el estado de una licencia de conducir en Guatemala. No es un servicio oficial.">
<style>
/* ==========================================================================
   LICENCIA CLARA · Hoja de estilos única
   Diseño: claro, con color, móvil primero. Texto grande y botones grandes.
   Si quieres cambiar los colores, cambia SOLO las variables de :root.

   Contraste: todos los textos sobre su fondo cumplen al menos 4.5:1 (WCAG AA).
   Las medidas de texto usan rem para que la web crezca si la persona agranda
   la letra en su navegador o teléfono.
   ========================================================================== */

:root {
  /* --- Superficies ----------------------------------------------------- */
  --fondo:        #F5F7FB;
  --superficie:   #FFFFFF;
  --superficie-2: #F1F5FA;
  --borde:        #E1E7F0;
  --borde-fuerte: #BFCBDB;
  --tinta:        #14202E;
  --tinta-suave:  #55657A;

  /* --- Marca ----------------------------------------------------------- */
  --acento:        #0E5C8C;
  --acento-oscuro: #0A4568;
  --acento-claro:  #1B84B8;
  --acento-suave:  #E6F1F8;
  /* El final del degradado es más oscuro que en la v1.0 para que el texto
     blanco se lea bien en todo el ancho (antes bajaba a 3:1). */
  --degradado:     linear-gradient(135deg, #0E5C8C 0%, #136E88 55%, #0E7667 100%);
  --degradado-suave: linear-gradient(135deg, #EAF3FA 0%, #E8F6F4 100%);

  /* --- Las dos consultas (identidad de servicio, siempre con texto) ----- */
  --multas:        #0E7667;   /* verde azulado: multas vehiculares, por placa */
  --multas-oscuro: #0A5A4F;
  --multas-suave:  #E3F4F0;
  --licencia:        #0E5C8C; /* azul: estado de la licencia, con identidad */
  --licencia-oscuro: #0A4568;
  --licencia-suave:  #E6F1F8;

  /* --- Estados (siempre con icono y texto, nunca solo color) ------------ */
  --accion-fondo: #FFF3D6;  --accion-texto: #8A5000;  --accion-borde: #F0C877;
  --juzgado-fondo:#E2EDFA;  --juzgado-texto:#14508C;  --juzgado-borde:#B2CDEC;
  --transito-fondo:#EDE9FB; --transito-texto:#4B3B94; --transito-borde:#C7BCEE;
  --listo-fondo:  #D9F5E4;  --listo-texto:  #0E6034;  --listo-borde:  #9EDCBA;
  --alerta-fondo: #FEE4E2;  --alerta-texto: #9A2A1F;  --alerta-borde: #F5B5AF;

  /* --- Colores por municipalidad (acento de identidad, no de estado) ---- */
  --muni-1: #1B5FA8;   /* azul   */
  --muni-2: #0E8C77;   /* verde  */
  --muni-3: #7E4BC4;   /* morado */
  --muni-4: #C2621C;   /* naranja*/
  --muni-5: #B03A6E;   /* rosa   */
  --muni-6: #2C7A8C;   /* petróleo */

  /* --- Medidas --------------------------------------------------------- */
  --radio:       16px;
  --radio-chico: 10px;
  --ancho:       48rem;
  --toque:       3rem;       /* alto mínimo de botones y campos (≈ 54 px) */
  --sombra:      0 1px 2px rgba(20,32,46,.05), 0 4px 14px rgba(20,32,46,.06);
  --sombra-alta: 0 2px 6px rgba(20,32,46,.07), 0 12px 28px rgba(20,32,46,.10);
}

/* --------------------------------------------------------------- Base --- */

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--tinta);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 112.5%;        /* 18 px con la letra normal; crece con la del navegador */
  line-height: 1.6;
  overflow-x: hidden;
  overflow-wrap: break-word;
}

h1, h2, h3 { line-height: 1.25; margin: 0 0 .5rem; font-weight: 700; letter-spacing: -.015em; }
h1 { font-size: clamp(1.5rem, 1.2rem + 1.6vw, 1.85rem); }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.12rem; }
p  { margin: 0 0 .9rem; }
a  { color: var(--acento); }

.contenedor {
  width: 100%; max-width: var(--ancho); margin: 0 auto;
  padding: 20px 16px 64px;
}

.suave      { color: var(--tinta-suave); }
.pequeno    { font-size: .9rem; }
.centro     { text-align: center; }
.sin-margen { margin: 0; }
.mt   { margin-top: 1rem; }
.mt2  { margin-top: 1.9rem; }
.mb   { margin-bottom: 1rem; }

.solo-lectores {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.saltar {
  position: absolute; left: -9999px; top: 0;
  background: var(--acento); color: #fff; padding: 12px 16px; z-index: 100;
}
.saltar:focus { left: 0; }

a:focus-visible, button:focus-visible, input:focus-visible,
select:focus-visible, textarea:focus-visible, summary:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid #1B6FA8;
  outline-offset: 3px; border-radius: 6px;
}
h2[tabindex="-1"]:focus { outline: none; }

/* ------------------------------------------------------------ Cabecera --- */

.barra { background: var(--superficie); border-bottom: 1px solid var(--borde); }
.barra-interna {
  max-width: var(--ancho); margin: 0 auto; padding: 12px 16px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.marca {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 1.05rem; color: var(--tinta); text-decoration: none;
}
.marca-icono {
  width: 32px; height: 32px; border-radius: 9px;
  background: var(--degradado); color: #fff;
  display: grid; place-items: center; font-size: .9rem; font-weight: 700;
  flex: 0 0 auto; letter-spacing: .02em;
}
.barra-derecha { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.barra--identidad { background: #1E2E42; border-bottom-color: #1E2E42; }
.barra--identidad .marca { color: #fff; }
.barra--identidad .marca-icono { background: #fff; color: #1E2E42; }

.barra--panel { background: #24384D; border-bottom-color: #24384D; }
.barra--panel .marca { color: #fff; }
.barra--panel .marca-icono { background: #fff; color: #24384D; }

body.tema-identidad { background: #E9EEF4; }
body.tema-panel     { background: #EDF0F4; }

/* ----------------------------------------------------------- Portada --- */

.portada {
  background: var(--degradado);
  color: #fff;
  padding: 34px 16px 40px;
  margin-bottom: -26px;
}
.portada-interna { max-width: var(--ancho); margin: 0 auto; }
.portada h1 { color: #fff; font-size: clamp(1.6rem, 1.2rem + 2vw, 2.15rem); margin-bottom: .6rem; max-width: 34rem; }
.portada p  { color: #fff; font-size: 1.08rem; margin-bottom: 0; }
.portada .portada-demo {
  display: inline-flex; gap: 8px; align-items: baseline; margin-top: 14px;
  font-size: .9rem; font-weight: 600;
  background: rgba(0,0,0,.18); border-radius: 14px; padding: 5px 14px;
}
.portada .servicio { margin-bottom: 12px; }
.portada--multas { background: linear-gradient(135deg, #0A5A4F 0%, #0E7667 60%, #136E88 100%); }
.portada-etiqueta {
  display: inline-block; margin-bottom: 12px;
  background: rgba(255,255,255,.18); color: #fff;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 999px; padding: 4px 13px;
  font-size: .82rem; font-weight: 600; letter-spacing: .02em;
}

/* --------------------------------------------------------------- Aviso --- */

.aviso {
  display: flex; gap: 10px; align-items: flex-start;
  background: #FFF8E6; border: 1px solid #F2DFA8;
  border-radius: var(--radio-chico); padding: 13px 15px;
  font-size: .92rem; color: #6B4E12;
}
.aviso strong { color: #5A3F0B; }
.aviso-icono { flex: 0 0 auto; line-height: 1.5; }

.aviso--neutro { background: var(--superficie-2); border-color: var(--borde); color: var(--tinta-suave); }
.aviso--neutro strong { color: var(--tinta); }

.aviso--jurado {
  background: linear-gradient(135deg, #FFF4E0 0%, #FFEDE4 100%);
  border-color: #F0C99A; color: #7A4A12;
}

/* -------------------------------------------------------------- Tarjeta --- */

.tarjeta {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 18px 16px;
  box-shadow: var(--sombra);
  margin-bottom: 14px;
}
.tarjeta-titulo { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: .35rem; }

a.tarjeta-enlace { display: block; text-decoration: none; color: inherit; transition: box-shadow .15s, transform .15s; }
a.tarjeta-enlace:hover { box-shadow: var(--sombra-alta); transform: translateY(-1px); }

/* Tarjeta con franja de color de la municipalidad */
.tarjeta--muni { border-top: 4px solid var(--color-muni, var(--acento)); }

.muni-encabezado { display: flex; align-items: center; gap: 12px; }
.muni-sello {
  width: 42px; height: 42px; border-radius: 12px; flex: 0 0 auto;
  background: var(--color-muni, var(--acento)); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: .92rem;
}

/* ------------------------------------------------------------- Botones --- */

.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--toque); padding: 12px 20px;
  border-radius: var(--radio-chico); border: 1px solid transparent;
  background: var(--acento); color: #fff;
  font: inherit; font-weight: 600; text-decoration: none;
  cursor: pointer; text-align: center;
  transition: background .15s, box-shadow .15s, transform .1s;
}
.boton:hover { background: var(--acento-oscuro); }
.boton:active { transform: translateY(1px); }

.boton--principal { background: var(--degradado); box-shadow: 0 3px 12px rgba(14,92,140,.28); }
.boton--principal:hover { background: var(--degradado); filter: brightness(1.06); }

.boton--secundario { background: var(--superficie); color: var(--acento); border-color: var(--borde-fuerte); }
.boton--secundario:hover { background: var(--acento-suave); border-color: var(--acento-claro); }

.boton--claro { background: #fff; color: var(--acento); }
.boton--claro:hover { background: #F0F6FB; }

.boton--bloque { width: 100%; }

/* Botón de cada consulta: mismo peso visual, distinto color de identidad. */
.boton--multas   { background: var(--multas); }
.boton--multas:hover   { background: var(--multas-oscuro); }
.boton--licencia { background: var(--licencia); }
.boton--licencia:hover { background: var(--licencia-oscuro); }

.boton[aria-disabled="true"], .boton:disabled {
  background: #EBEEF3; color: #5F6B7A; border-color: var(--borde);
  cursor: not-allowed; pointer-events: none; box-shadow: none;
}

.boton-texto {
  background: none; border: 0; padding: 8px 0; min-height: 44px;
  color: var(--acento); font: inherit; font-weight: 600; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px;
}

.botones { display: flex; flex-direction: column; gap: 10px; }
@media (min-width: 560px) {
  .botones--fila { flex-direction: row; flex-wrap: wrap; }
  .botones--fila > * { flex: 1 1 auto; }
}

.volver {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; color: var(--acento); font-weight: 600;
  text-decoration: none; margin-bottom: 6px;
}
.volver:hover { text-decoration: underline; }

/* --------------------------------------------------------------- Chips --- */

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 999px;
  font-size: .88rem; font-weight: 600; line-height: 1.35;
  border: 1px solid; background: #EDF1F6; color: #41505F; border-color: var(--borde-fuerte);
}
.chip-icono { font-size: .95em; }
.chip--accion   { background: var(--accion-fondo);   color: var(--accion-texto);   border-color: var(--accion-borde); }
.chip--juzgado  { background: var(--juzgado-fondo);  color: var(--juzgado-texto);  border-color: var(--juzgado-borde); }
.chip--transito { background: var(--transito-fondo); color: var(--transito-texto); border-color: var(--transito-borde); }
.chip--listo    { background: var(--listo-fondo);    color: var(--listo-texto);    border-color: var(--listo-borde); }
.chip--alerta   { background: var(--alerta-fondo);   color: var(--alerta-texto);   border-color: var(--alerta-borde); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* --------------------------------------------------- Bloque "haz esto" --- */

.accion-ahora {
  border: 1px solid var(--accion-borde);
  background: linear-gradient(135deg, #FFF6E2 0%, #FFF0D2 100%);
  border-radius: var(--radio); padding: 16px; margin-bottom: 14px;
}
.accion-ahora .etiqueta {
  font-size: .78rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .07em; color: var(--accion-texto); margin-bottom: 5px;
}
.accion-ahora .frase { font-size: 1.15rem; font-weight: 700; color: #4A3208; margin: 0 0 6px; }
.accion-ahora .quien { font-size: .95rem; color: #6B4B12; margin: 0; }

.accion-ahora--espera { background: linear-gradient(135deg, #E7F0FB 0%, #DDEAF8 100%); border-color: var(--juzgado-borde); }
.accion-ahora--espera .etiqueta, .accion-ahora--espera .quien { color: var(--juzgado-texto); }
.accion-ahora--espera .frase { color: #123F6E; }

.accion-ahora--transito { background: linear-gradient(135deg, #F0EDFC 0%, #E9E4FA 100%); border-color: var(--transito-borde); }
.accion-ahora--transito .etiqueta, .accion-ahora--transito .quien { color: var(--transito-texto); }
.accion-ahora--transito .frase { color: #3A2F66; }

.accion-ahora--listo { background: linear-gradient(135deg, #DEF6E7 0%, #D2F1DE 100%); border-color: var(--listo-borde); }
.accion-ahora--listo .etiqueta, .accion-ahora--listo .quien { color: var(--listo-texto); }
.accion-ahora--listo .frase { color: #0D4A26; }

/* ---------------------------------------------------- Listas de datos --- */

.datos { margin: 0; }
.datos div {
  display: flex; flex-direction: column; gap: 2px;
  padding: 10px 0; border-bottom: 1px solid var(--borde);
}
.datos div:last-child { border-bottom: 0; }
.datos dt { color: var(--tinta-suave); font-size: .9rem; }
.datos dd { margin: 0; font-weight: 600; }

@media (min-width: 560px) {
  .datos div { flex-direction: row; gap: 16px; justify-content: space-between; align-items: baseline; }
  .datos dt { flex: 0 0 auto; font-size: .93rem; }
  .datos dd { text-align: right; }
}

/* Glosario */
.glosario { margin: 0; }
.glosario dt { font-weight: 700; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--borde); }
.glosario dt:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.glosario dd { margin: 4px 0 0; color: var(--tinta); }

/* Resumen de 3 números */
.resumen { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 14px; }
@media (min-width: 520px) { .resumen { grid-template-columns: repeat(3, 1fr); } }
.resumen-caja {
  background: var(--superficie-2); border: 1px solid var(--borde);
  border-radius: var(--radio-chico); padding: 13px;
}
.resumen-numero { font-size: 1.8rem; font-weight: 700; line-height: 1.1; }
.resumen-texto  { font-size: .87rem; color: var(--tinta-suave); }
.resumen-caja--atencion {
  background: linear-gradient(135deg, #FFF3D6 0%, #FFEBC2 100%);
  border-color: var(--accion-borde);
}
.resumen-caja--atencion .resumen-numero, .resumen-caja--atencion .resumen-texto { color: var(--accion-texto); }
.resumen-caja--listo { background: linear-gradient(135deg, #DEF6E7 0%, #D0F0DD 100%); border-color: var(--listo-borde); }
.resumen-caja--listo .resumen-numero, .resumen-caja--listo .resumen-texto { color: var(--listo-texto); }

/* --------------------------------------------------------- Pasos guía --- */

.pasos { list-style: none; margin: 0; padding: 0; counter-reset: paso; }
.paso {
  position: relative; border: 1px solid var(--borde);
  border-radius: var(--radio-chico); background: var(--superficie);
  margin-bottom: 10px; overflow: hidden;
}
.paso[open] { border-color: var(--borde-fuerte); }
.paso > summary {
  list-style: none; cursor: pointer;
  padding: 14px 16px 14px 54px; min-height: 52px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600;
}
.paso > summary::-webkit-details-marker { display: none; }
.paso > summary::before {
  counter-increment: paso; content: counter(paso);
  position: absolute; left: 14px; top: 13px;
  width: 28px; height: 28px; border-radius: 50%;
  background: #E7ECF2; color: var(--tinta-suave);
  display: grid; place-items: center; font-size: .9rem; font-weight: 700;
}
.paso > summary::after { content: "▾"; margin-left: auto; padding-left: 10px; color: var(--tinta-suave); font-size: 1.1rem; }
.paso[open] > summary::after { content: "▴"; }
.paso--actual { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento), var(--sombra); }
.paso--actual > summary::before { background: var(--degradado); color: #fff; }
.paso--hecho > summary::before { background: var(--listo-fondo); color: var(--listo-texto); content: "✓"; }
.paso-cuerpo { padding: 0 16px 16px 54px; }
.paso-etiqueta {
  font-size: .76rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--acento); margin: 13px 0 2px;
}
.paso-cuerpo ul { margin: 4px 0 0; padding-left: 20px; }
.paso-cuerpo li { margin-bottom: 4px; }
.marca-actual {
  font-size: .76rem; font-weight: 700; color: #fff;
  background: var(--acento); border-radius: 999px; padding: 3px 10px;
}

/* --------------------------------------------------------- Historial --- */

.linea { list-style: none; margin: 0; padding: 0; }
.linea li { position: relative; padding: 0 0 18px 26px; border-left: 2px solid var(--borde); margin-left: 6px; }
.linea li:last-child { border-left-color: transparent; padding-bottom: 0; }
.linea li::before {
  content: ""; position: absolute; left: -7px; top: 6px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--borde-fuerte); border: 2px solid var(--fondo);
}
.linea li.reciente::before { background: var(--acento); box-shadow: 0 0 0 3px var(--acento-suave); }
.linea .fecha { font-size: .85rem; color: var(--tinta-suave); }
.linea .titulo { font-weight: 600; }
.linea .fuente {
  display: inline-block; font-size: .78rem; margin-top: 4px;
  background: var(--acento-suave); color: var(--acento); border-radius: 999px; padding: 2px 10px;
  font-weight: 600;
}

/* --------------------------------------------------------- Formulario --- */

.campo { margin-bottom: 16px; }
.campo label { display: block; font-weight: 600; margin-bottom: 6px; }
.campo .ayuda { font-size: .88rem; color: var(--tinta-suave); margin-bottom: 6px; }

input[type="text"], input[type="password"], select, textarea {
  width: 100%; min-height: var(--toque); padding: 12px 14px;
  font: inherit; color: var(--tinta); background: var(--superficie);
  border: 1px solid var(--borde-fuerte); border-radius: var(--radio-chico);
}
input:focus, select:focus, textarea:focus { border-color: var(--acento); }
textarea { min-height: 110px; resize: vertical; }
input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: #B42318; }

.error, .exito {
  display: flex; gap: 8px; align-items: flex-start;
  margin-top: 8px; padding: 11px 13px;
  border-radius: var(--radio-chico); font-size: .92rem; font-weight: 600;
}
.error { background: var(--alerta-fondo); border: 1px solid var(--alerta-borde); color: var(--alerta-texto); }
.exito { background: var(--listo-fondo); border: 1px solid var(--listo-borde); color: var(--listo-texto); }

.credenciales {
  background: var(--degradado-suave); border: 1px solid var(--borde);
  border-radius: var(--radio); padding: 15px; margin-bottom: 18px;
}
.credenciales h3 { font-size: .95rem; margin-bottom: 8px; }
.credenciales table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.credenciales th, .credenciales td { text-align: left; padding: 5px 6px 5px 0; }
.credenciales th { color: var(--tinta-suave); font-weight: 600; }
.credenciales code { background: #fff; border: 1px solid var(--borde); border-radius: 5px; padding: 1px 6px; }
/* En pantallas angostas o con letra grande, cada usuario de prueba se
   muestra como una ficha en vez de una tabla que se sale de la pantalla. */
@media (max-width: 36rem) {
  .credenciales table, .credenciales tbody, .credenciales tr, .credenciales td { display: block; width: 100%; }
  .credenciales thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .credenciales tr { background: rgba(255,255,255,.7); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  .credenciales td { padding: 0; }
  .credenciales td:nth-child(2)::before { content: "Usuario: "; color: var(--tinta-suave); }
  .credenciales td:nth-child(3)::before { content: "Contraseña: "; color: var(--tinta-suave); }
}

/* --------------------------------------------------------- Contactos --- */

.contacto-dato { padding: 10px 0; border-bottom: 1px solid var(--borde); }
.contacto-dato:last-of-type { border-bottom: 0; }
.contacto-dato .rotulo { font-size: .85rem; color: var(--tinta-suave); }
.contacto-dato .valor  { font-weight: 600; }
.pendiente { color: #9A2A1F; font-weight: 600; }
.nota-verificacion {
  font-size: .84rem; color: var(--tinta-suave);
  border-top: 1px dashed var(--borde); margin-top: 10px; padding-top: 10px;
}

/* ----------------------------------------------------------- Detalles --- */

.desplegable {
  border: 1px solid var(--borde); border-radius: var(--radio-chico);
  background: var(--superficie); margin-bottom: 10px;
}
.desplegable > summary {
  cursor: pointer; padding: 14px 16px; min-height: 52px;
  display: flex; align-items: center; font-weight: 600; gap: 10px; list-style: none;
}
.desplegable > summary::-webkit-details-marker { display: none; }
.desplegable > summary::after { content: "▾"; margin-left: auto; color: var(--tinta-suave); font-size: 1.1rem; }
.desplegable[open] > summary::after { content: "▴"; }
.desplegable-cuerpo { padding: 0 16px 16px; }

/* -------------------------------------------------------- Estado vacío --- */

.vacio {
  text-align: center; padding: 30px 18px;
  background: var(--superficie); border: 1px dashed var(--borde-fuerte);
  border-radius: var(--radio);
}
.vacio-icono {
  width: 54px; height: 54px; margin: 0 auto 10px; border-radius: 50%;
  background: var(--degradado-suave); color: var(--acento);
  display: grid; place-items: center; font-size: 1.5rem;
}
.vacio p { color: var(--tinta-suave); margin: 8px 0 0; }

.cargando { text-align: center; padding: 40px 16px; color: var(--tinta-suave); }

/* ============================================== CONSULTA POR PLACA ====== */

/* Campo de placa: se ve como una placa de verdad */
.placa-caja { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.placa-caja label { line-height: 1.3; }
.placa-tipo { flex: 0 0 7.5rem; }
.placa-numero { flex: 1 1 9rem; min-width: 0; }
.placa-caja input, .placa-caja select { min-width: 0; }
#placa-numero, .placa-numero input {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 1.25rem; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; text-align: center;
}
.placa-muestra {
  display: inline-flex; align-items: center; gap: 8px;
  background: #fff; border: 2px solid var(--tinta); border-radius: 8px;
  padding: 7px 14px; font-family: ui-monospace, Menlo, Consolas, monospace;
  font-weight: 700; font-size: 1.05rem; letter-spacing: .06em;
}
.placa-muestra .tipo {
  background: var(--tinta); color: #fff; border-radius: 4px;
  padding: 1px 7px; font-size: .85rem;
}

/* Lista de portales durante la consulta simulada */
.portales { list-style: none; margin: 0; padding: 0; }
.portal {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 0; border-bottom: 1px solid var(--borde);
}
.portal:last-child { border-bottom: 0; }
.portal-luz {
  width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto;
  display: grid; place-items: center; font-size: .85rem; font-weight: 700;
  background: #E7ECF2; color: #98A5B4;
  transition: background .25s, color .25s, box-shadow .25s;
}
/* El nombre y el lugar van en renglones distintos: si quedan pegados
   se leen como una sola palabra ("EMETRAMunicipalidad de Guatemala"). */
.portal-texto  { flex: 1 1 auto; min-width: 0; }
.portal-nombre { display: block; font-weight: 600; font-size: .95rem; line-height: 1.35; }
.portal-lugar  { display: block; font-size: .82rem; color: var(--tinta-suave); line-height: 1.4; }
.portal-marca  { font-size: .82rem; font-weight: 600; color: var(--tinta-suave); flex: 0 0 auto; text-align: right; max-width: 40%; }

.portal--consultando .portal-luz {
  background: var(--acento-suave); color: var(--acento);
  box-shadow: 0 0 0 4px rgba(27,132,184,.16);
  animation: latido 1s ease-in-out infinite;
}
.portal--consultando .portal-marca { color: var(--acento); }
.portal--listo .portal-luz { background: var(--listo-fondo); color: var(--listo-texto); }
.portal--listo .portal-marca { color: var(--listo-texto); }
.portal--hallazgo .portal-luz { background: var(--accion-fondo); color: var(--accion-texto); }
.portal--hallazgo .portal-marca { color: var(--accion-texto); }

@keyframes latido {
  0%, 100% { box-shadow: 0 0 0 3px rgba(27,132,184,.14); }
  50%      { box-shadow: 0 0 0 8px rgba(27,132,184,.05); }
}

/* Barra de avance de la consulta */
.avance {
  height: 8px; border-radius: 999px; background: var(--superficie-2);
  overflow: hidden; margin: 4px 0 16px; border: 1px solid var(--borde);
}
.avance-relleno {
  height: 100%; width: 0%; background: var(--degradado);
  transition: width .28s ease;
}

/* Encabezado de resultados */
.resultado-cabecera {
  background: var(--degradado); color: #fff;
  border-radius: var(--radio); padding: 18px 16px; margin-bottom: 14px;
}
.resultado-cabecera h2 { color: #fff; margin-bottom: 4px; }
.resultado-cabecera p { color: #fff; margin: 0; font-size: .95rem; }
.resultado-cabecera .servicio { margin-bottom: 10px; }
.resultado-cabecera--multas { background: linear-gradient(135deg, #0A5A4F 0%, #0E7667 60%, #136E88 100%); }
/* La placa va sobre fondo blanco aunque la cabecera sea de color:
   si hereda el blanco del encabezado, el número desaparece. */
.resultado-cabecera .placa-muestra {
  margin-top: 10px; background: #fff; color: var(--tinta); border-color: #fff;
}
.resultado-cabecera .placa-muestra .tipo { background: var(--tinta); color: #fff; }

/* Sello del portal que "encontró" el caso */
.sello-portal {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--superficie-2); border: 1px solid var(--borde);
  border-radius: 999px; padding: 4px 12px;
  font-size: .82rem; font-weight: 600; color: var(--tinta-suave);
}
.sello-portal .punto {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--color-muni, var(--acento)); flex: 0 0 auto;
}

/* Cuadrícula de tipos de placa */
.tipos-nota { font-size: .84rem; color: var(--tinta-suave); margin-top: -8px; }


/* ====================================== LAS DOS CONSULTAS DEL INICIO ==== */

.opciones { display: grid; grid-template-columns: 1fr; gap: 16px; position: relative; }
@media (min-width: 40rem) { .opciones { grid-template-columns: 1fr 1fr; } }

.opcion {
  display: flex; flex-direction: column;
  background: var(--superficie); border: 1px solid var(--borde);
  border-top: 6px solid var(--color-opcion);
  border-radius: var(--radio); padding: 20px 18px;
  box-shadow: var(--sombra);
}
.opcion--multas   { --color-opcion: var(--multas);   --color-opcion-suave: var(--multas-suave); }
.opcion--licencia { --color-opcion: var(--licencia); --color-opcion-suave: var(--licencia-suave); }
.opcion h3 { font-size: 1.4rem; margin: 12px 0 4px; color: var(--tinta); }
.opcion-cabeza { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.opcion-icono {
  width: 52px; height: 52px; border-radius: 14px; flex: 0 0 auto;
  display: grid; place-items: center;
  background: var(--color-opcion-suave); color: var(--color-opcion);
}
.opcion-requisito {
  font-size: .85rem; font-weight: 700; color: var(--color-opcion);
  background: var(--color-opcion-suave); border-radius: 999px; padding: 3px 12px;
}
.opcion-descripcion { font-size: 1.08rem; margin-bottom: .5rem; }
.opcion-detalle { font-size: .92rem; color: var(--tinta-suave); margin-bottom: 1.1rem; }
.opcion .boton { margin-top: auto; font-size: 1.05rem; }

/* Etiqueta de servicio: icono + texto, nunca solo color */
.servicio {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: .88rem; font-weight: 700; line-height: 1.3;
  border-radius: 16px; padding: 4px 13px 4px 4px;
  background: var(--multas-suave); color: var(--multas-oscuro);
}
.servicio-icono {
  min-width: 26px; height: 26px; padding: 0 5px; border-radius: 999px;
  display: grid; place-items: center; font-size: .72rem; letter-spacing: .02em;
  background: var(--multas); color: #fff;
}
.servicio--licencia { background: var(--licencia-suave); color: var(--licencia-oscuro); }
.servicio--licencia .servicio-icono { background: var(--licencia); }
.servicio--claro { background: rgba(255,255,255,.95); }

.nota-servicio {
  font-size: .95rem; color: var(--tinta);
  border-left: 4px solid var(--borde-fuerte); padding: 4px 0 4px 12px; margin: 1rem 0;
}

/* Casilla (checkbox) grande y fácil de tocar */
.campo .casilla, .casilla {
  display: flex; align-items: center; gap: 10px;
  min-height: 44px; margin: 6px 0 0; font-weight: 500; cursor: pointer;
}
.casilla input { width: 22px; height: 22px; flex: 0 0 auto; margin: 0; }

/* ======================================================== MULTAS ======== */

.multa {
  background: var(--superficie-2); border: 1px solid var(--borde);
  border-left: 5px solid var(--accion-borde);
  border-radius: var(--radio-chico); padding: 14px; margin-top: 12px;
}
.multa--pagada { border-left-color: var(--listo-borde); }
.multa-arriba { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.multa-ref { font-size: .85rem; color: var(--tinta-suave); }
.multa-rotulo { font-size: .85rem; color: var(--tinta-suave); margin: 0; }
.multa-infraccion { font-size: 1.1rem; font-weight: 700; line-height: 1.35; margin: 0 0 6px; }
.multa .datos dd { font-weight: 500; }
.multa .datos dd.monto { font-weight: 700; }
.nowrap { white-space: nowrap; }
.datos--compactos div { padding: 7px 0; }
.datos .monto, .monto { font-variant-numeric: tabular-nums; white-space: nowrap; }
.datos dd.monto { font-size: 1.1rem; }

.total { border-left: 6px solid var(--multas); }
.total-rotulo { font-size: .9rem; font-weight: 700; color: var(--tinta-suave); margin: 0; }
.total-cifra {
  font-size: 2rem; font-weight: 700; line-height: 1.2; margin: 2px 0 8px;
  color: var(--tinta); font-variant-numeric: tabular-nums;
}
.total-cifra--listo { color: var(--listo-texto); font-size: 1.6rem; }
.total-cifra--pendiente { color: #9A2A1F; font-size: 1.3rem; }
.total-lista { margin: 0 0 10px; padding-left: 20px; }
.total-lista li { margin-bottom: 3px; }

/* Tabla de montos de referencia (Orientación) */
.tabla-desplazable {
  overflow-x: auto; background: var(--superficie);
  border: 1px solid var(--borde); border-radius: var(--radio-chico); margin-bottom: 14px;
}
.tabla { width: 100%; border-collapse: collapse; font-size: .93rem; min-width: 36rem; }
.tabla th, .tabla td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--borde); }
.tabla th { background: var(--superficie-2); color: var(--tinta); font-weight: 700; }
.tabla tr:last-child td { border-bottom: 0; }
.verif { display: inline-flex; gap: 5px; font-weight: 600; font-size: .88rem; }
.verif--ok { color: var(--listo-texto); }
.verif--pendiente { color: #9A2A1F; }
.lista-correcciones { margin: 0; padding-left: 20px; }
.lista-correcciones li { margin-bottom: 10px; }

/* --------------------------------------------------------------- Pie --- */

.pie {
  border-top: 1px solid var(--borde); background: var(--superficie);
  padding: 22px 16px 44px; font-size: .88rem; color: var(--tinta-suave);
}
.pie-interna { max-width: var(--ancho); margin: 0 auto; }
.pie a { color: var(--acento); }
.pie ul { list-style: none; padding: 0; margin: 10px 0 0; }
.pie li { margin-bottom: 6px; }

/* -------------------------------------------------------- Impresión --- */

@media print {
  .barra, .pie, .no-imprimir, .volver, .portada { display: none !important; }
  body { background: #fff; font-size: 12pt; }
  .tarjeta, .paso { break-inside: avoid; box-shadow: none; border-color: #999; }
  .paso .paso-cuerpo, .desplegable-cuerpo { display: block !important; }
  .accion-ahora, .resultado-cabecera { background: #fff !important; color: #000 !important; border: 2px solid #000; }
  .multa { break-inside: avoid; }
  .resultado-cabecera h2, .resultado-cabecera p { color: #000 !important; }
  a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 9pt; word-break: break-all; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  a.tarjeta-enlace:hover, .boton:active { transform: none; }
}

/* Celulares muy angostos (320 px) o letra muy grande: todo en una columna. */
@media (max-width: 22rem) {
  .placa-caja { flex-direction: column; }
  .placa-tipo { flex: 1 1 auto; }
  .portal { flex-wrap: wrap; }
  .portal-marca { max-width: none; text-align: left; margin-left: 38px; }
}

</style>
<style>

  .perfil { display: flex; align-items: center; gap: 14px; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--acento-suave); color: var(--acento);
    display: grid; place-items: center;
    font-weight: 700; font-size: 1.25rem; flex: 0 0 auto;
  }
  .perfil-nombre { font-weight: 600; font-size: 1.05rem; }
  .muni-cabecera { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; }

  .codigo {

    background: #EEF1F4; border: 1px solid var(--borde);

  }
  .razon {
    background: #F4F6F8; border-left: 4px solid var(--borde-fuerte);

  }


  .fila-caso {
    display: flex; gap: 12px; align-items: center; justify-content: space-between;
    flex-wrap: wrap;
    padding: 14px 0; border-bottom: 1px solid var(--borde);
  }
  .fila-caso:last-child { border-bottom: 0; }

</style>
</head>

<div id="app"></div>

<script type="text/plantilla" id="tpl-inicio" data-clase="">
<a class="saltar" href="#" data-saltar="1">Saltar al contenido</a>

<header class="barra">
  <div class="barra-interna">
    <a class="marca" href="#inicio">
      <span class="marca-icono" aria-hidden="true">LC</span>
      Licencia Clara
    </a>
    <div class="barra-derecha" id="barra-derecha"></div>
  </div>
</header>

<div class="portada">
  <div class="portada-interna">
    <h1>Consulta tus multas vehiculares y el estado de tu licencia</h1>
    <p>Son dos consultas distintas. Elige la que necesitas.</p>
    <p class="portada-demo"><span aria-hidden="true">●</span> Demostración con datos ficticios. No es un servicio oficial.</p>
  </div>
</div>

<main class="contenedor" id="contenido">

  <h2 class="solo-lectores">Elige una consulta</h2>

  <div class="opciones">

    <section class="opcion opcion--multas" aria-labelledby="titulo-multas">
      <div class="opcion-cabeza">
        <span class="opcion-icono" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="30" height="30" focusable="false"><rect x="3" y="8" width="26" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8 13h6M8 18h4M18 13h6M18 18h6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </span>
        <span class="opcion-requisito">No necesitas ingresar</span>
      </div>
      <h3 id="titulo-multas">Multas vehiculares</h3>
      <p class="opcion-descripcion">Consulta por número de placa.</p>
      <p class="opcion-detalle">Vas a necesitar: el tipo y el número de placa del vehículo.</p>
      <a class="boton boton--multas boton--bloque" href="#consulta-placa">Consultar multas <span aria-hidden="true">→</span></a>
    </section>

    <section class="opcion opcion--licencia" aria-labelledby="titulo-licencia">
      <div class="opcion-cabeza">
        <span class="opcion-icono" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="30" height="30" focusable="false"><rect x="3" y="6" width="26" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="11" cy="14" r="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M6.5 21.5c1-2.6 2.6-3.5 4.5-3.5s3.5.9 4.5 3.5M19 12h6M19 17h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </span>
        <span class="opcion-requisito">Necesitas ingresar</span>
      </div>
      <h3 id="titulo-licencia">Estado de la licencia</h3>
      <p class="opcion-descripcion">Ingresa con tu identidad digital para consultar tu licencia y sus bloqueos.</p>
      <p class="opcion-detalle">Vas a necesitar: tu usuario y contraseña de identidad digital.</p>
      <a class="boton boton--licencia boton--bloque" href="#identidad" id="ir-licencia">Consultar mi licencia <span aria-hidden="true">→</span></a>
    </section>

  </div>

  <div class="centro mt2">
    <a class="boton boton--secundario" href="#orientacion">Consultar orientación</a>
  </div>

  <details class="desplegable mt2">
    <summary>¿Qué diferencia hay entre una multa y un bloqueo?</summary>
    <div class="desplegable-cuerpo">
      <p><strong>La multa vehicular</strong> es la sanción económica por una infracción.
      Queda asociada a la placa del vehículo y se paga a la municipalidad.
      Por eso se consulta con la placa.</p>
      <p><strong>El bloqueo de licencia</strong> es una marca en el registro de una persona
      en el Departamento de Tránsito. Impide hacer trámites con su licencia y lo ordena un
      Juzgado de Asuntos Municipales de Tránsito. Por eso se consulta ingresando con identidad digital.</p>
      <p class="sin-margen"><strong>Son registros distintos.</strong> Pagar una multa no levanta un
      bloqueo por sí solo, no todo bloqueo tiene una multa y consultar una placa no dice
      nada sobre la licencia de nadie.</p>
    </div>
  </details>

  <div class="mt" id="aviso-demo"></div>

  <p class="centro mt2 pequeno suave">
    <a href="#panel">Panel institucional (demostración)</a>
  </p>

</main>

<footer class="pie">
  <div class="pie-interna">
    <p class="sin-margen"><strong>Licencia Clara</strong> · Demostración con datos ficticios.</p>
    <p class="sin-margen mt">No es un servicio oficial ni tiene respaldo del Ministerio de Gobernación,
    del Departamento de Tránsito ni de ninguna municipalidad.</p>
    <ul>
      <li><a href="#orientacion">Orientación y fuentes</a></li>
      <li><button type="button" class="boton-texto" id="reiniciar">Reiniciar los datos de la demostración</button></li>
    </ul>
    <p class="pequeno" id="aviso-guardado"></p>
  </div>
</footer>
</script>

<script type="text/plantilla" id="tpl-identidad" data-clase="tema-identidad">
<a class="saltar" href="#" data-saltar="1">Saltar al contenido</a>

<header class="barra barra--identidad">
  <div class="barra-interna">
    <span class="marca">
      <span class="marca-icono" aria-hidden="true">ID</span>
      Identidad Digital · Prototipo / Simulación
    </span>
  </div>
</header>

<main class="contenedor" id="contenido">

  <a class="volver" href="#inicio"><span aria-hidden="true">←</span> Volver al inicio de Licencia Clara</a>

  <div class="aviso mb" role="note">
    <span class="aviso-icono" aria-hidden="true">●</span>
    <span><strong>Esta pantalla es una simulación.</strong> Representa cómo sería
    entrar con una identidad digital, pero no es autenticación segura, no es un
    portal del Gobierno y no debes escribir aquí credenciales reales de ningún servicio.</span>
  </div>

  <div id="etiqueta-servicio" class="mb"></div>
  <h1>Ingresa con tu identidad digital</h1>
  <p class="suave">Para ver el estado de tu licencia y sus bloqueos primero debes
  identificarte. Licencia Clara no te pide crear una cuenta nueva: te identificas
  aquí y regresas a tu licencia.</p>
  <p class="nota-servicio">¿Solo quieres ver las multas de un vehículo? Eso no necesita ingreso:
  <a href="#consulta-placa">consultar multas por placa</a>.</p>

  <div id="sesion-abierta"></div>

  <div class="credenciales">
    <h3>Credenciales de prueba</h3>
    <table>
      <thead>
        <tr><th scope="col">Ciudadano</th><th scope="col">Usuario</th><th scope="col">Contraseña</th></tr>
      </thead>
      <tbody id="tabla-credenciales"></tbody>
    </table>
    <p class="pequeno suave sin-margen mt">Toca un usuario para llenar el formulario. Después pulsa <strong>Ingresar</strong>.</p>
  </div>

  <form id="formulario" novalidate>
    <div class="campo">
      <label for="usuario">Usuario</label>
      <p class="ayuda" id="ayuda-usuario">Por ejemplo: sofia.demo</p>
      <input type="text" id="usuario" name="usuario" autocomplete="off"
             autocapitalize="none" spellcheck="false"
             aria-describedby="ayuda-usuario" required>
    </div>

    <div class="campo">
      <label for="clave">Contraseña</label>
      <p class="ayuda" id="ayuda-clave">Para esta demostración todas son: demo1234</p>
      <input type="password" id="clave" name="clave" autocomplete="off"
             aria-describedby="ayuda-clave" required>

<main class="contenedor" id="contenido">

  <a class="volver" href="#inicio"><span aria-hidden="true">←</span> Volver al inicio</a>

  <h1>Orientación general</h1>
  <p class="suave">Esta página no necesita que ingreses. Explica el recorrido
  completo y de dónde sacamos cada dato.</p>

  <h2 class="mt2">Cinco palabras que conviene no confundir</h2>

  <div class="tarjeta">
    <dl class="glosario">
      <dt>Infracción</dt>
      <dd>El hecho. La esquela o remisión que te levantaron.</dd>

      <dt>Multa</dt>
      <dd>La sanción económica. Queda asociada a la placa del vehículo y se paga a la municipalidad.</dd>

      <dt>Bloqueo</dt>
      <dd>Una marca en tu registro del Departamento de Tránsito que impide hacer
      trámites con tu licencia. Es un dato personal. Lo ordena un Juzgado de Asuntos Municipales de Tránsito.</dd>

      <dt>Orden</dt>
      <dd>El oficio original de desbloqueo que emite ese juzgado cuando tu situación
      queda resuelta.</dd>

      <dt>Levantamiento</dt>
      <dd>El acto del Departamento de Tránsito, cuando resuelve la solicitud.</dd>
    </dl>
  </div>

  <div class="aviso">
    <span class="aviso-icono" aria-hidden="true">●</span>
    <span><strong>Dos ideas importantes.</strong> Pagar la multa no levanta el bloqueo por sí solo.
    Y no siempre existe una multa por cada bloqueo, ni un bloqueo por cada multa.
    Por eso en Licencia Clara son dos consultas: <strong>multas vehiculares por placa</strong>
    y <strong>estado de la licencia con identidad digital</strong>.</span>
  </div>

  <h2 class="mt2">El recorrido, paso a paso</h2>

  <ol class="pasos">
    <li><details class="paso paso--actual" open>
      <summary>Identifica qué juzgado ordenó el bloqueo</summary>
      <div class="paso-cuerpo">
        <p>El bloqueo lo ordena un Juzgado de Asuntos Municipales de Tránsito de una
        municipalidad concreta. Si tienes bloqueos de varias municipalidades, cada uno
        se resuelve por separado, en su propio juzgado.</p>
        <p class="sin-margen"><strong>Los procedimientos no son iguales entre municipios.</strong>
        Lo que aplica en Guatemala no necesariamente aplica en Mixco o en Villa Nueva.</p>
      </div>
    </details></li>

    <li><details class="paso">
      <summary>Resuelve tu situación con la municipalidad</summary>
      <div class="paso-cuerpo">
        <p>El juzgado te indica qué corresponde en tu caso. Si hay una multa, se paga
        en las cajas municipales o en los bancos autorizados. Guarda siempre el comprobante.</p>
        <p class="sin-margen">Esta demostración muestra el <strong>monto base</strong> que fija el
        Reglamento de Tránsito para cada infracción de ejemplo, con su artículo. El monto a pagar lo
        confirma la municipalidad; aquí no calculamos descuentos, intereses ni recargos.</p>
      </div>
    </details></li>

    <li><details class="paso">
      <summary>Pide la orden original de desbloqueo</summary>
      <div class="paso-cuerpo">
        <p>El Catálogo Nacional de Trámites es explícito: el requisito del desbloqueo es el
        <strong>oficio original de desbloqueo de licencia remitido por el Juzgado de Asuntos
        Municipales de Tránsito</strong>.</p>
        <p class="sin-margen pequeno suave">Fuente:
        <a href="https://tramites.gob.gt/servicio/3142/" target="_blank" rel="noopener">Catálogo Nacional de Trámites — Desbloqueo de licencias de conducir de juzgados municipales de tránsito</a>.
        Consultado el 10/09/2026.</p>
      </div>
    </details></li>

    <li><details class="paso">
      <summary>Presenta la solicitud ante el Departamento de Tránsito</summary>
      <div class="paso-cuerpo">
        <p>Según el Catálogo Nacional de Trámites, el trámite tiene un <strong>costo de Q 0</strong>,
        un <strong>tiempo de respuesta de 5 días</strong>, produce una <strong>resolución</strong>
        y su base legal son los <strong>artículos 40 y 40 bis de la Ley de Tránsito</strong>.
        El tipo de gestión aparece como en línea y presencial.</p>
        <p>El Departamento de Tránsito indica como requisitos la solicitud del usuario y la
        orden de desbloqueo emitida por juez competente, y describe un procedimiento en línea
        con registro de usuario adjuntando DPI.</p>
        <p class="paso-etiqueta">Contacto del Departamento de Tránsito</p>
        <p class="sin-margen">4a calle 6-17, zona 1, Guatemala · Teléfono 2220-5383</p>
        <div class="botones botones--fila mt">
          <a class="boton" href="tel:22205383">Llamar</a>
          <a class="boton boton--secundario" href="https://transito.gob.gt/tramites-en-linea/" target="_blank" rel="noopener">Trámites en línea</a>
        </div>
      </div>
    </details></li>

    <li><details class="paso">
      <summary>Confirma que el bloqueo se levantó</summary>
      <div class="paso-cuerpo">
        <p>El Departamento de Tránsito describe una <strong>bitácora del trámite</strong> donde
        se ve el avance de la solicitud. El caso se cierra cuando aparece la resolución.</p>
        <p class="sin-margen"><strong>Ni el pago ni la orden del juzgado levantan el bloqueo por sí solos.</strong>
        El levantamiento lo hace el Departamento de Tránsito.</p>
      </div>
    </details></li>
  </ol>

  <h2 class="mt2">Lo que no pudimos verificar</h2>
  <div class="tarjeta">
    <p>Preferimos decirlo antes que inventarlo:</p>
    <ul style="padding-left:20px">
      <li><strong>Qué significa exactamente "presentar el original" cuando el canal es en línea.</strong>
      El catálogo indica que la gestión es en línea y presencial, pero no desglosa si el oficio
      se sube escaneado, se entrega físicamente después, o si el juzgado lo remite directamente.</li>
      <li><strong>Cuál es la dirección vigente de la plataforma de trámites del Departamento de Tránsito.</strong>
      Aparece publicada en dos direcciones distintas: una en el sitio del Departamento de Tránsito y otra
      en la Comisaría Digital de la PNC. Además, el nombre "Portal SCT" que menciona el reto no aparece
      en las páginas oficiales que consultamos; ahí se llama "Trámites en línea".</li>
      <li><strong>El horario del Juzgado de Asuntos Municipales y de Tránsito de Mixco</strong>,
      y la vigencia de su dirección: la única fuente municipal que encontramos es un directorio
      fechado en 2018. En la web, ese dato aparece sin confirmar y su botón está desactivado.</li>
      <li><strong>La vigencia actual de los montos de las multas.</strong> Los tomamos de la cartilla del
      Departamento de Tránsito y los contrastamos con otra fuente, pero no encontramos un texto consolidado
      oficial actualizado a 2026. Los detalles están en la sección <em>Montos de referencia de las multas</em>.</li>
      <li><strong>Descuentos, intereses, recargos y plazos de cada municipalidad.</strong> No los calculamos
      ni los mostramos.</li>
    </ul>
    <p class="sin-margen">Tampoco intentamos catalogar todas las infracciones del país: queda fuera del alcance de este prototipo.</p>
  </div>

  <h2 class="mt2" id="montos">Montos de referencia de las multas</h2>
  <p class="suave">Estos son los montos base del Reglamento de Tránsito que usan las multas de ejemplo.
  No son deudas: son la cantidad que fija la norma para cada infracción.</p>
  <div id="base-legal"></div>
  <div id="tabla-montos"></div>

  <h3 class="mt2">Qué corregimos de la clasificación recibida</h3>
  <div id="correcciones"></div>

  <h2 class="mt2">Juzgados y contactos</h2>
  <div id="contactos"></div>

  <h2 class="mt2">Fuentes consultadas</h2>
  <div id="fuentes"></div>

  <h2 class="mt2">Qué es y qué no es este prototipo</h2>
  <div class="tarjeta">
    <p><strong>Qué es:</strong> una demostración que muestra cómo se vería la información
    de los bloqueos de una licencia si las instituciones la compartieran en un solo lugar.</p>
    <p><strong>Qué no es:</strong> no consulta sistemas reales del Departamento de Tránsito
    ni de los juzgados, no paga multas, no levanta bloqueos, no envía solicitudes ni formularios,
    y no tiene respaldo de ninguna institución.</p>
    <p><strong>La identidad digital es una simulación</strong>, no autenticación segura.
    Un identificador guardado en el navegador no es una identidad verificada.</p>
    <p class="sin-margen"><strong>Los cambios se guardan solo en este navegador y en este dispositivo.</strong>
    No es una base de datos compartida entre computadoras.</p>
  </div>

</main>

  </div>
</footer>

          que_llevar: ["El número de trámite"],

        { titulo: "Si te hacen una observación, corrígela",

          que_llevar: ["El documento o dato que te pidan corregir"],
          donde: "transito", pago: "", documento: "", verificacion: "" },

        { titulo: "Confirma que el bloqueo se levantó",
          detalle: "El caso se cierra cuando aparece la resolución. El Catálogo Nacional de Trámites indica un tiempo de respuesta de 5 días.",
          que_llevar: ["El número de trámite"],

    {

      pasos: [
        { titulo: "Guarda la resolución",
          detalle: "Conserva la resolución del Departamento de Tránsito. Es tu respaldo de que este bloqueo fue levantado.",
          que_llevar: [], donde: "", pago: "",
          documento: "Resolución del Departamento de Tránsito.", verificacion: "" },

        { titulo: "Revisa si te queda algún otro bloqueo",
          detalle: "Que este caso esté resuelto no significa que no existan otros. Revisa la pantalla de tu licencia para ver si te queda alguno activo.",
          que_llevar: [], donde: "", pago: "", documento: "", verificacion: "" }

    }
